<text x="960.0" y="348.0" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#B3302A" text-anchor="middle" letter-spacing="2">PREMIERĂ</text>
<text x="960.0" y="320.0" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#B3302A" text-anchor="middle" letter-spacing="1">✶ CONSEMNATĂ ✶</text>
<text x="960.0" y="372.0" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#B3302A" text-anchor="middle" letter-spacing="3">2026</text>
</g>
<text x="530.0" y="400.0" font-family="'Noto Serif', serif" font-size="30" font-weight="700" fill="#2B2622" text-anchor="start">Tudor, 16 ani</text>
<text x="530.0" y="428.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#6B5E52" text-anchor="start" font-style="italic">personaj fictiv · elev într-un liceu din Sibiu (neprecizat)</text>
<text x="530.0" y="470.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">Mă numesc Tudor, am 16 ani și sunt un personaj</text>
<text x="530.0" y="500.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">fictiv. Premiera mea nu apare în nicio carte de</text>
<text x="530.0" y="530.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">istorie: sâmbătă am urcat pentru prima dată singur în</text>
<text x="530.0" y="560.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">Turnul Sfatului. Am numărat treptele, m-am oprit la</text>
<text x="530.0" y="590.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">fiecare fereastră și, sus, am văzut Piața Mare și Piața</text>
<text x="530.0" y="620.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">Mică deodată, ca pe o hartă vie. Nimeni nu a</text>
<text x="530.0" y="650.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">aplaudat. Dar am înțeles ceva: fiecare lucru mare din</text>
<text x="530.0" y="680.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">orașul acesta a fost, cândva, o primă dată a cuiva –</text>
<text x="530.0" y="710.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">prima farmacie, prima școală, primul pod de fontă.</text>
<text x="530.0" y="740.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">Așa că mi-am făcut o fișă de premieră. Următoarea:</text>
<text x="530.0" y="770.0" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2622" text-anchor="start">să vorbesc în fața clasei fără foaie.</text>
<text x="530.0" y="804.0" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#6B5E52" text-anchor="start" font-style="italic">text la persoana I · 100 de cuvinte</text>
<text x="530.0" y="836.0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#B9583A" text-anchor="start">Premiera</text>
<text x="648.0" y="836.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#2B2622" text-anchor="start">prima urcare singur în Turnul Sfatului</text>
<line x1="530" y1="844" x2="1030" y2="844" stroke="#D8CDB8" stroke-width="1"/>
<text x="530.0" y="866.0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#B9583A" text-anchor="start">Data</text>
<text x="648.0" y="866.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#2B2622" text-anchor="start">o sâmbătă din 2026</text>
<line x1="530" y1="874" x2="1030" y2="874" stroke="#D8CDB8" stroke-width="1"/>
<text x="530.0" y="896.0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#B9583A" text-anchor="start">Martori</text>
<text x="648.0" y="896.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#2B2622" text-anchor="start">niciunul – și e în regulă</text>
<line x1="530" y1="904" x2="1030" y2="904" stroke="#D8CDB8" stroke-width="1"/>
<text x="530.0" y="926.0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#B9583A" text-anchor="start">Următoarea</text>
<text x="648.0" y="926.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#2B2622" text-anchor="start">primul discurs în fața clasei, fără foaie</text>
<line x1="530" y1="934" x2="1030" y2="934" stroke="#D8CDB8" stroke-width="1"/>
<text x="900.0" y="960.0" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#6B5E52" text-anchor="end" font-style="italic">semnătura:</text>
<path d="M910,956 q18,-26 36,-4 t34,-10 t28,4" fill="none" stroke="#2B2622" stroke-width="1.6"/>
<rect x="1120" y="230" width="720" height="476" rx="22" fill="#141E28" stroke="#2A3845" stroke-width="1.5" />
<text x="1152.0" y="276.0" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#E2A62B" text-anchor="start" letter-spacing="3">FIȘA DE PREMIERĂ A ORAȘULUI</text>
<text x="1152.0" y="300.0" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#7E8A96" text-anchor="start" font-style="italic">conform patrimoniu.sibiu.ro · fapte verificate</text>
<text x="1152.0" y="392.0" font-family="'Noto Serif', serif" font-size="84" font-weight="700" fill="#F3EFE6" text-anchor="start">1494</text>
<g filter="url(#shs)"><path d="M1664,340 h112 l-14,64 q-42,14 -84,0 Z" fill="#E2A62B"/><ellipse cx="1720" cy="340" rx="56" ry="12" fill="#F0C65B"/><rect x="1664" y="404" width="112" height="14" rx="4" fill="#C98F22"/><line x1="1738" y1="346" x2="1786" y2="276" stroke="#E6D8B8" stroke-width="14" stroke-linecap="round"/><circle cx="1734" cy="350" r="12" fill="#E6D8B8"/></g>
<text x="1152.0" y="440.0" font-family="'Noto Serif', serif" font-size="26" font-weight="700" fill="#F3EFE6" text-anchor="start">prima farmacie de pe actualul</text>
<text x="1152.0" y="474.0" font-family="'Noto Serif', serif" font-size="26" font-weight="700" fill="#F3EFE6" text-anchor="start">teritoriu al României</text>
<text x="1152.0" y="518.0" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#A9B4C0" text-anchor="start">„Farmacia orașului”, publică, în Piața Mare, înființată în perioada marilor epidemii de</text>
<text x="1152.0" y="542.0" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#A9B4C0" text-anchor="start">ciumă. Primul farmacist consemnat: Johannes, pe o chitanță din 1494. Sediul nu mai</text>
<text x="1152.0" y="566.0" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#A9B4C0" text-anchor="start">există – pe locul lui se află azi turnul Bisericii Romano-Catolice.</text>
<text x="1152.0" y="612.0" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#E2A62B" text-anchor="start">Alte «prima dată» ale orașului:</text>
<text x="1152.0" y="636.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#A9B4C0" text-anchor="start">1292 – primul spital · 1380 – prima atestare a unei școli · 1788 – prima clădire de teatru · 1859</text>
<text x="1152.0" y="658.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#A9B4C0" text-anchor="start">– primul pod din fontă turnată</text>
<text x="1152.0" y="682.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#7E8A96" text-anchor="start" font-style="italic">toate: „de pe actualul teritoriu al României”, conform sursei</text>
<rect x="1120" y="728" width="720" height="272" rx="22" fill="#0E7C86" stroke="#0E7C86" stroke-width="1.5" />
<text x="1152.0" y="778.0" font-family="'Noto Serif', serif" font-size="110" font-weight="700" fill="#E2A62B" text-anchor="start">„</text>
<text x="1152.0" y="842.0" font-family="'Noto Serif', serif" font-size="42" font-weight="700" fill="#F3EFE6" text-anchor="start">Orașul a început</text>
<text x="1152.0" y="892.0" font-family="'Noto Serif', serif" font-size="42" font-weight="700" fill="#F3EFE6" text-anchor="start">cu niște «prima dată».</text>
<text x="1152.0" y="956.0" font-family="'Noto Serif', serif" font-size="58" font-weight="700" fill="#E2A62B" text-anchor="start">Și tu.</text>
