<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>M22</title></head><body>
<script src="lib.js"></script>
<script>
// M22 – Trailer AI pentru o piesă de teatru IMAGINARĂ despre Podul Minciunilor („Fontă și adevăr”).
// Piesa, personajele, replicile și „premiera” sunt inventate și declarate ca atare în cadre.
// Fapte despre pod (fișa de fapte ACTIV AI): terminat 1859; inaugurat 17 decembrie 1860; primul pod din fontă din România;
// inscripțiile „1859” și „FRIEDRICHSHÜTTE”; leagă Orașul de Sus de Orașul de Jos (Piața Mică); legenda prăbușirii.
// Podul, inscripțiile și orașul sunt desenate stilizat (nu reproduceri exacte).
// Muzica: 96 BPM, 4/4 – o măsură = 2,5 s; tăieturile cad pe măsuri.
const W = 1920, H = 1080, ctx = setupCanvas(W, H);
const S = 2.4;                      // rezoluția straturilor pre-randate (pentru zoom)
const L = '#F3EFE6';
const IRON = '#2B3539', IRON_HI = '#61727A', IRON_DK = '#121A1E';
const DECK = 440, GIRD = 474;       // nivelul pasarelei și marginea de jos a grinzii
const AX0 = 540, AX1 = 1380, ASPR = 610, ACTRL = 366;

function fade(t, t0, t1, fi = .3, fo = .3) { if (t < t0 || t > t1) return 0; return Math.min(smooth(t0, t0 + fi, t), 1 - smooth(t1 - fo, t1, t)); }
function fitSize(str, weight, size, maxW, family = 'Inter') {
  let s = size; ctx.font = `${weight} ${s}px ${family}`;
  while (ctx.measureText(str).width > maxW && s > 14) { s -= 1; ctx.font = `${weight} ${s}px ${family}`; }
  return s;
}
function archY(x) { const u = (x - AX0) / (AX1 - AX0); return (1 - u) * (1 - u) * ASPR + 2 * u * (1 - u) * ACTRL + u * u * ASPR; }
function nz(x, s = 0) { return Math.sin(x * 1.7 + s) * .5 + Math.sin(x * 2.9 + s * 1.3) * .3 + Math.sin(x * 5.3 + s * 2.1) * .2; }

function layer(w = W, h = H, sc = S) { const c = document.createElement('canvas'); c.width = w * sc; c.height = h * sc; const b = c.getContext('2d'); b.scale(sc, sc); return [c, b]; }

// ---------------------------------------------------------------- lumea: podul noaptea (pre-randat)
const [worldC, wb] = layer(), [railC, rb] = layer();
const EYES_P = [];
(function drawWorld() {
  const b = wb;
  const g = b.createLinearGradient(0, 0, 0, 720); g.addColorStop(0, '#050A14'); g.addColorStop(.55, '#122039'); g.addColorStop(1, '#2B3652');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  stars(b, W, H, .85, 31);
  // luna
  const mx = 1196, my = 178;
  const hg = b.createRadialGradient(mx, my, 20, mx, my, 190); hg.addColorStop(0, 'rgba(243,239,230,.35)'); hg.addColorStop(1, 'rgba(243,239,230,0)');
  b.fillStyle = hg; b.fillRect(mx - 200, my - 200, 400, 400);
  b.fillStyle = '#EDE6D6'; b.beginPath(); b.arc(mx, my, 40, 0, 7); b.fill();
  b.fillStyle = 'rgba(160,150,135,.35)'; for (const [dx, dy, r] of [[-12, -8, 9], [10, 6, 7], [-4, 16, 5], [14, -14, 4]]) { b.beginPath(); b.arc(mx + dx, my + dy, r, 0, 7); b.fill(); }
  // Orașul de Sus, în spate (case cu „ochi”)
  houses(b, { y0: 470, W: 1600, x0: 330, seed: 12, wallH: 120, walls: ['#C9B79A', '#B9A88F', '#A9B3A4', '#C4A893'], roofs: ['#7A3F2C', '#8A4A32', '#6E3A2A'], night: .7, tint: '#0B1322', tintAmt: .66, t: 0 });
  // vederea pe sub pod: strada care continuă, case mai departe
  b.save(); b.beginPath(); b.rect(500, GIRD - 4, 920, 360); b.clip();
  const ug = b.createLinearGradient(0, GIRD, 0, 800); ug.addColorStop(0, '#0B1322'); ug.addColorStop(1, '#1A2438');
  b.fillStyle = ug; b.fillRect(500, GIRD - 4, 920, 360);
  houses(b, { y0: 780, W: 1450, x0: 470, seed: 5, wallH: 210, walls: ['#B9A88F', '#A9B3A4', '#C9B79A'], roofs: ['#6E3A2A', '#7A3F2C'], night: .45, tint: '#070D18', tintAmt: .82, t: 0 });
  b.restore();
  // strada din prim-plan (pavaj)
  const sg = b.createLinearGradient(0, 780, 0, H); sg.addColorStop(0, '#2A2C33'); sg.addColorStop(1, '#14161B');
  b.fillStyle = sg; b.fillRect(0, 780, W, H - 780);
  const rr = rng(9);
  for (let y = 786, row = 0; y < H; row++) {
    const sh = 8 + row * 2.6, sw = 24 + row * 6;
    for (let x = -rr() * sw; x < W; x += sw + 4) {
      b.fillStyle = mix('#3A3C44', '#24262C', rr()); roundRect(b, x, y, sw, sh, Math.min(7, sh / 2)); b.fill();
      b.fillStyle = 'rgba(255,200,120,.05)'; b.fillRect(x + 3, y + 1, sw - 6, 2);
    }
    y += sh + 4;
  }
  // clădirile laterale (pereți în care se sprijină podul)
  for (const [x0, x1, seed] of [[-10, 528, 3], [1392, 1930, 4]]) {
    const r = rng(seed);
    const wg = b.createLinearGradient(x0, 0, x1, 0);
    if (x0 < 0) { wg.addColorStop(0, '#1E1C25'); wg.addColorStop(1, '#3A3542'); } else { wg.addColorStop(0, '#3A3542'); wg.addColorStop(1, '#1B1922'); }
    b.fillStyle = wg; b.fillRect(x0, 110, x1 - x0, H);
    b.fillStyle = 'rgba(0,0,0,.25)'; b.fillRect(x0, 776, x1 - x0, 10);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) {
      const wx = x0 + 80 + i * 150, wy = 170 + j * 150; if (wy > 640) continue;
      const lit = r() < .4;
      b.fillStyle = lit ? '#E9B866' : '#151820'; b.fillRect(wx, wy, 56, 84);
      b.fillStyle = 'rgba(0,0,0,.35)'; b.fillRect(wx + 26, wy, 4, 84); b.fillRect(wx, wy + 38, 56, 4);
      b.fillStyle = 'rgba(255,255,255,.07)'; b.fillRect(wx - 6, wy + 84, 68, 6);
    }
    // ușă boltită la parter
    const dx = x0 < 0 ? 210 : 1580;
    b.fillStyle = '#100F14'; b.beginPath(); b.moveTo(dx, 780); b.lineTo(dx, 690); b.arc(dx + 55, 690, 55, Math.PI, 0); b.lineTo(dx + 110, 780); b.closePath(); b.fill();
    // console de piatră sub arc
    const cx = x0 < 0 ? 500 : 1380;
    b.fillStyle = '#5A5260'; b.fillRect(cx, 592, 40, 52); b.fillStyle = 'rgba(0,0,0,.3)'; b.fillRect(cx, 636, 40, 8);
  }
  // ---- podul din fontă (stilizat)
  // arcul
  b.beginPath();
  for (let x = AX0; x <= AX1; x += 4) b.lineTo(x, archY(x) - 14);
  for (let x = AX1; x >= AX0; x -= 4) b.lineTo(x, archY(x) + 9);
  b.closePath(); b.fillStyle = IRON; b.fill();
  b.strokeStyle = rgba(IRON_HI, .9); b.lineWidth = 2.5; b.beginPath(); for (let x = AX0; x <= AX1; x += 4) b.lineTo(x, archY(x) - 14); b.stroke();
  b.strokeStyle = IRON_DK; b.lineWidth = 2; b.beginPath(); for (let x = AX0; x <= AX1; x += 4) b.lineTo(x, archY(x) + 9); b.stroke();
  // rozetele din timpane (de la capete spre mijloc, simetric)
  const ring = (x, y, r) => {
    b.strokeStyle = IRON; b.lineWidth = Math.max(3, r * .22); b.beginPath(); b.arc(x, y, r, 0, 7); b.stroke();
    b.strokeStyle = rgba(IRON_HI, .7); b.lineWidth = 1.4; b.beginPath(); b.arc(x, y, r + b.lineWidth, Math.PI * 1.05, Math.PI * 1.7); b.stroke();
    b.strokeStyle = IRON; b.lineWidth = Math.max(2, r * .1); b.beginPath(); b.arc(x, y, r * .45, 0, 7); b.stroke();
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; b.beginPath(); b.moveTo(x + Math.cos(a) * r * .45, y + Math.sin(a) * r * .45); b.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); b.stroke(); }
  };
  const side = [];
  let x = AX0 + 6;
  for (let k = 0; k < 12; k++) {
    let r = (archY(x) - 14 - GIRD) / 2 - 3;
    let cx = x + r;
    r = (archY(cx) - 14 - GIRD) / 2 - 3;
    if (r < 8 || cx > 900) break;
    side.push([cx, GIRD + (archY(cx) - 14 - GIRD) / 2, r]);
    x = cx + r + 12;
  }
  for (const [cx, cy, r] of side) {
    ring(cx, cy, r); ring(AX0 + AX1 - cx, cy, r);
    const xm = AX0 + AX1 - cx;
    b.fillStyle = IRON;
    b.fillRect(cx + r + 2, GIRD, 7, archY(cx + r + 5) - 12 - GIRD);
    b.fillRect(xm - r - 9, GIRD, 7, archY(xm - r - 5) - 12 - GIRD);
  }
  // mijlocul (unde timpanul e îngust): bare verticale scurte
  const xl = side.length ? side[side.length - 1][0] + side[side.length - 1][2] + 22 : 900;
  for (let xx = xl; xx <= AX0 + AX1 - xl; xx += 18) { const hh = archY(xx) - 12 - GIRD; if (hh > 2) { b.fillStyle = IRON; b.fillRect(xx - 2, GIRD, 4, hh); } }
  EYES_P.push({ x: side[0][0], y: side[0][1], r: side[0][2] }, { x: AX0 + AX1 - side[0][0], y: side[0][1], r: side[0][2] });
  // grinda pasarelei
  b.fillStyle = IRON; b.fillRect(512, DECK, 896, GIRD - DECK);
  b.fillStyle = rgba(IRON_HI, .8); b.fillRect(512, DECK, 896, 3);
  b.fillStyle = IRON_DK; b.fillRect(512, GIRD - 4, 896, 4);
  b.fillStyle = 'rgba(0,0,0,.35)'; b.fillRect(512, DECK + 9, 896, 2); b.fillRect(512, GIRD - 11, 896, 2);
  for (let xx = 530; xx < 1400; xx += 28) { b.fillStyle = IRON_DK; b.beginPath(); b.arc(xx, DECK + 18, 5, 0, 7); b.fill(); b.fillStyle = rgba(IRON_HI, .6); b.beginPath(); b.arc(xx - 1, DECK + 17, 2, 0, 7); b.fill(); }

  // ---- balustrada și stâlpii felinarelor (strat separat, desenat peste personaje)
  const c = rb;
  c.fillStyle = IRON; c.fillRect(508, 366, 904, 9); c.fillStyle = rgba(IRON_HI, .9); c.fillRect(508, 366, 904, 2);
  c.fillStyle = IRON; c.fillRect(516, 430, 888, 6);
  for (let xx = 520; xx < 1400; xx += 40) {
    c.fillStyle = IRON; c.fillRect(xx - 2, 372, 4, 60);
    c.strokeStyle = IRON; c.lineWidth = 3.2; c.beginPath(); c.arc(xx + 20, 401, 13, 0, 7); c.stroke();
    c.beginPath(); c.moveTo(xx + 20, 375); c.lineTo(xx + 20, 388); c.moveTo(xx + 20, 414); c.lineTo(xx + 20, 430); c.stroke();
    c.strokeStyle = rgba(IRON_HI, .55); c.lineWidth = 1.2; c.beginPath(); c.arc(xx + 20, 401, 14.5, Math.PI * 1.1, Math.PI * 1.6); c.stroke();
  }
  for (const xx of [520, 740, 960, 1180, 1400]) {
    c.fillStyle = IRON; c.fillRect(xx - 6, 360, 12, 80);
    c.beginPath(); c.arc(xx, 355, 8, 0, 7); c.fill(); c.fillStyle = rgba(IRON_HI, .7); c.beginPath(); c.arc(xx - 2, 353, 3, 0, 7); c.fill();
  }
  // felinarele
  for (const lx of [548, 1372]) {
    c.fillStyle = IRON; c.fillRect(lx - 5, 300, 10, 140);
    c.beginPath(); c.moveTo(lx - 18, 296); c.lineTo(lx + 18, 296); c.lineTo(lx + 12, 262); c.lineTo(lx - 12, 262); c.closePath(); c.fill();
    c.fillStyle = '#FFD98A'; c.fillRect(lx - 10, 266, 20, 26);
    c.fillStyle = IRON; c.fillRect(lx - 1.5, 266, 3, 26);
    c.beginPath(); c.moveTo(lx - 16, 264); c.lineTo(lx, 246); c.lineTo(lx + 16, 264); c.closePath(); c.fill();
    c.beginPath(); c.arc(lx, 243, 4, 0, 7); c.fill();
  }
})();

// ---------------------------------------------------------------- inscripțiile (prim-plan, pre-randat)
const [plateC, pb] = layer(W + 200, H, 1.4);
function drawPlates() {
  const b = pb, PW = W + 200;
  const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0A0F18'); g.addColorStop(1, '#141B26'); b.fillStyle = g; b.fillRect(0, 0, PW, H);
  // bokeh: lumini de felinar în fundal
  const r = rng(44);
  for (let i = 0; i < 26; i++) { const x = r() * PW, y = r() * H, rad = 20 + r() * 60; const bg = b.createRadialGradient(x, y, 0, x, y, rad); bg.addColorStop(0, `rgba(255,200,120,${.10 + r() * .12})`); bg.addColorStop(1, 'rgba(255,200,120,0)'); b.fillStyle = bg; b.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  // grinda de fontă
  const gg = b.createLinearGradient(0, 300, 0, 790); gg.addColorStop(0, '#3A464B'); gg.addColorStop(.5, '#2B3539'); gg.addColorStop(1, '#1C2428');
  b.fillStyle = gg; b.fillRect(0, 300, PW, 490);
  // textură (granulație de turnare)
  for (let i = 0; i < 9000; i++) { b.fillStyle = r() < .5 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.035)'; b.fillRect(r() * PW, 300 + r() * 490, 1 + r() * 2, 1 + r() * 2); }
  for (const y of [300, 772]) { b.fillStyle = '#4A585E'; b.fillRect(0, y, PW, 18); b.fillStyle = 'rgba(0,0,0,.4)'; b.fillRect(0, y + 16, PW, 3); }
  for (let x = 30; x < PW; x += 64) for (const y of [338, 750]) { b.fillStyle = '#1A2125'; b.beginPath(); b.arc(x, y, 9, 0, 7); b.fill(); b.fillStyle = 'rgba(150,170,175,.45)'; b.beginPath(); b.arc(x - 2, y - 2, 4, 0, 7); b.fill(); }
  const raised = (str, x, y, size, align = 'center') => {
    b.font = `700 ${size}px "Noto Serif"`; b.textAlign = align; b.textBaseline = 'middle';
    b.fillStyle = '#0B1013'; b.fillText(str, x + 4, y + 5);
    b.fillStyle = '#8A9A9F'; b.fillText(str, x - 2, y - 2);
    b.fillStyle = '#46545A'; b.fillText(str, x, y);
  };
  const plaque = (path, inset) => {
    b.fillStyle = '#0B1013'; b.save(); b.translate(5, 6); path(0); b.fill(); b.restore();
    b.fillStyle = '#56666C'; path(0); b.fill();
    b.fillStyle = '#2F3A3F'; path(inset); b.fill();
    b.strokeStyle = 'rgba(160,180,185,.35)'; b.lineWidth = 2; path(inset); b.stroke();
  };
  // medalion cu „1859”
  plaque(k => { b.beginPath(); b.ellipse(560, 545, 250 - k, 168 - k, 0, 0, 7); }, 18);
  raised('1859', 560, 556, 170);
  // bandă cu „FRIEDRICHSHÜTTE”
  plaque(k => { roundRect(b, 900 + k, 462 + k, 900 - 2 * k, 166 - 2 * k, 26 - k * .5); }, 16);
  let s = 84; b.font = `700 ${s}px "Noto Serif"`; while (b.measureText('FRIEDRICHSHÜTTE').width > 800) { s -= 2; b.font = `700 ${s}px "Noto Serif"`; }
  raised('FRIEDRICHSHÜTTE', 1350, 552, s);
}

// ---------------------------------------------------------------- textura de film (granulație)
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 256;
(function () { const g = grainC.getContext('2d'), im = g.createImageData(256, 256), r = rng(123); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); })();
const grainP = ctx.createPattern(grainC, 'repeat');
function grain(t, a = .045) {
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  const k = Math.floor(t * 25); ctx.translate(-((k * 97) % 256), -((k * 61) % 256)); ctx.fillStyle = grainP; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}
function vignette(a = .55) {
  const vg = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------- personaje fictive (siluete fără fețe)
const RIM = 'rgba(242,190,110,.9)', SIL = '#0A0E15', FIG = 1.3;
// siluetă cu lumină de contur: forma desenată o dată în culoarea conturului (decalată spre felinar), apoi în negru
function figure(x, f, rimDx, parts, extras) {
  ctx.save(); ctx.translate(x, f); ctx.scale(FIG, FIG); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save(); ctx.translate(rimDx, -1.1); parts(RIM); ctx.restore();
  parts(SIL);
  if (extras) extras();
  ctx.restore();
}
function ucenica(x, f, t, o = {}) {
  const bob = Math.sin(t * 2.2) * .6;
  figure(x, f, -1.5, c => {
    ctx.fillStyle = c; ctx.strokeStyle = c;
    ctx.fillRect(-7, -34, 5, 34); ctx.fillRect(2, -34, 5, 34);
    ctx.beginPath(); ctx.moveTo(-9, -80); ctx.lineTo(9, -80); ctx.quadraticCurveTo(14, -55, 25, -28); ctx.quadraticCurveTo(0, -22, -25, -28); ctx.quadraticCurveTo(-14, -55, -9, -80); ctx.fill();
    ctx.fillRect(-3, -88 + bob, 7, 10);
    ctx.beginPath(); ctx.arc(1.5, -93 + bob, 11, 0, 7); ctx.fill();
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-7, -96 + bob); ctx.quadraticCurveTo(-17, -84, -13, -66); ctx.stroke();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-4, -76); ctx.lineTo(-13, -60); ctx.lineTo(-18, -56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -76); ctx.lineTo(11, -58); ctx.stroke();
  }, () => {
    // fundița și scrisoarea ascunsă la spate (secretul)
    ctx.fillStyle = PAL.ocru; ctx.beginPath(); ctx.moveTo(-13, -66); ctx.lineTo(-20, -70); ctx.lineTo(-20, -61); ctx.closePath(); ctx.moveTo(-13, -66); ctx.lineTo(-6, -70); ctx.lineTo(-6, -61); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(-22, -58); ctx.rotate(-.35);
    if (o.glow) { const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 26); gg.addColorStop(0, `rgba(255,214,140,${.55 * o.glow})`); gg.addColorStop(1, 'rgba(255,214,140,0)'); ctx.fillStyle = gg; ctx.fillRect(-28, -28, 56, 56); }
    ctx.fillStyle = '#F1E6CF'; ctx.fillRect(-8, -5, 16, 11); ctx.strokeStyle = 'rgba(120,90,60,.8)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(0, 1); ctx.lineTo(8, -5); ctx.stroke();
    ctx.fillStyle = '#B9583A'; ctx.beginPath(); ctx.arc(0, 1.5, 2, 0, 7); ctx.fill();
    ctx.restore();
  });
}
function umbrella(cx, cy, R, spin, col) {
  ctx.save();
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * .72, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * .12, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(243,239,230,.55)'; ctx.lineWidth = 1.2;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 + spin; if (Math.sin(a) < 0) continue;
    const rx = cx + R * Math.cos(a);
    ctx.beginPath(); ctx.moveTo(cx, cy - R * .72); ctx.quadraticCurveTo(cx + R * Math.cos(a) * .92, cy - R * .5, rx, cy + R * .1 * Math.sin(a)); ctx.stroke();
  }
  ctx.strokeStyle = RIM; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(cx, cy, R, R * .72, 0, Math.PI * 1.45, Math.PI * 1.95); ctx.stroke();
  ctx.fillStyle = '#20242C'; ctx.beginPath(); ctx.arc(cx, cy - R * .74, 2.5, 0, 7); ctx.fill();
  ctx.restore();
}
function negustor(x, f, t, o = {}) {
  // mănunchiul de umbrele închise, în spate
  ctx.save(); ctx.translate(x, f); ctx.scale(FIG, FIG); ctx.lineCap = 'round';
  ['#E2A62B', '#0E7C86', '#B9583A', '#6E56CF'].forEach((c, k) => { ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(4 + k * 3, -30); ctx.lineTo(22 + k * 5, -120 - k * 4); ctx.stroke(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(22 + k * 5, -120 - k * 4); ctx.lineTo(24 + k * 5, -129 - k * 4); ctx.lineTo(19 + k * 5, -119 - k * 4); ctx.fill(); });
  ctx.restore();
  figure(x, f, 1.5, c => {
    ctx.fillStyle = c; ctx.strokeStyle = c;
    ctx.fillRect(-8, -40, 6, 40); ctx.fillRect(2, -40, 6, 40);
    ctx.beginPath(); ctx.moveTo(-13, -104); ctx.lineTo(13, -104); ctx.lineTo(21, -34); ctx.lineTo(-23, -34); ctx.closePath(); ctx.fill();
    ctx.fillRect(-3.5, -110, 7, 8);
    ctx.beginPath(); ctx.arc(0, -117, 10.5, 0, 7); ctx.fill();
    ctx.fillRect(-9, -150, 18, 28);
    ctx.beginPath(); ctx.ellipse(0, -122, 18, 3.6, 0, 0, 7); ctx.fill();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-9, -99); ctx.lineTo(-22, -88); ctx.lineTo(-19, -110); ctx.stroke();
  }, () => {
    ctx.fillStyle = PAL.tigla; ctx.fillRect(-9, -128, 18, 4);

    ctx.beginPath(); ctx.arc(-22.5, -104, 3.5, 0, Math.PI); ctx.stroke();

// ---------------------------------------------------------------- cadrul cu podul (cameră + elemente animate)

// ---------------------------------------------------------------- cortina
function curtain(open, spot = 1) {
  const top = 110, bot = 1020, half = W / 2;

  if (wNow > 1) for (const sd of [-1, 1]) {
    const xa = sd < 0 ? 0 : W - wNow, N = 16;
    for (let i = 0; i < N; i++) {
      const u0 = i / N, u1 = (i + 1) / N, sx0 = xa + u0 * wNow, sx1 = xa + u1 * wNow + .8;
      const lift = open * 90 * (sd < 0 ? u0 : 1 - u0);

  ctx.fillStyle = '#7E1422';
  for (let x = 0; x < W; x += 120) { ctx.beginPath(); ctx.moveTo(x, top + 60); ctx.quadraticCurveTo(x + 60, top + 118, x + 120, top + 60); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = PAL.ocru; ctx.lineWidth = 3; ctx.beginPath(); for (let x = 0; x < W; x += 120) { ctx.moveTo(x, top + 60); ctx.quadraticCurveTo(x + 60, top + 118, x + 120, top + 60); } ctx.stroke();
  ctx.fillStyle = PAL.ocru; ctx.fillRect(0, top + 56, W, 4);
  // reflector
  if (wNow > 1 && spot > 0) {
    const sg = ctx.createRadialGradient(W / 2, 560, 60, W / 2, 560, 820); sg.addColorStop(0, `rgba(255,230,180,${.18 * spot})`); sg.addColorStop(.5, 'rgba(0,0,0,0)'); sg.addColorStop(1, `rgba(0,0,0,${.6 * spot})`);
    ctx.fillStyle = sg; ctx.fillRect(0, top, W, bot - top);
  }
  // scena (rampa cu lumini)
  ctx.fillStyle = '#1B120E'; ctx.fillRect(0, 990, W, 30);
  for (let x = 60; x < W; x += 120) { const lg = ctx.createRadialGradient(x, 992, 2, x, 992, 70); lg.addColorStop(0, 'rgba(255,214,140,.5)'); lg.addColorStop(1, 'rgba(255,214,140,0)'); ctx.fillStyle = lg; ctx.fillRect(x - 70, 920, 140, 100); }
}
