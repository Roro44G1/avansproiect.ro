<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>M24</title></head><body>
<script src="lib.js"></script>
<script>
// M24 – Istoria tiparului la Sibiu (1525, 1544) – animație AI (74 s)
// Partea I: procesul GENERAL al tiparului cu litere mobile (en.wikipedia: Movable type, Type metal, Composing stick,
//           Printing press, Papermaking, Letterpress printing, Bookbinding) – nu atelierul din Sibiu.
// Partea a II-a: cronologia de la Sibiu – doar din fișa de fapte („Tiparul la Sibiu”).
// Fără portrete ale persoanelor istorice; cărțile și calendarul sunt desene cu aspect imaginat (declarat pe ecran).
const W = 1920, H = 1080, ctx = setupCanvas(W, H);
const TEND = 74;
const P1 = 4.0, STEP = 3.5;          // Partea I: 8 pași × 3,5 s  (4–32 s)
const TR0 = 32.0, P2 = 34.0;          // carton 32–34 s; Partea a II-a: 8 intrări (34–66 s), durate după lungimea textului
const EDUR = [5.5, 4.0, 4.0, 4.5, 3.0, 3.5, 4.5, 3.0];
const ESTART = EDUR.map((_, i) => P2 + EDUR.slice(0, i).reduce((a, b) => a + b, 0));
const FIN = 66.0;                    // cadrul de onestitate 66–74 s
// (muzica și efectele sonore din _audio/M24_tema_tiparului.py folosesc exact aceleași momente)

const METAL = '#9AA3AD', METAL_D = '#5F6873', METAL_L = '#D3D9DE';
const WOOD = '#7A5233', WOOD_D = '#4A3120', WOOD_L = '#A0714A';
const IRON = '#3A4048', PAPER = '#F1E9D6', PAPER_D = '#D9CDB2', INK = '#17120E';
const LEATHER = '#7A4A2E', MOLTEN = '#FF9A3C', GLOW = '#FFD27A', COPPER = '#B87333';
const L = PAL.var;
let GA = 1; // opacitatea scenei curente

// ------------------------------------------------------------------ utilitare de desen
function T(s, x, y, o = {}) { return text(ctx, s, x, y, Object.assign({}, o, { alpha: (o.alpha == null ? 1 : o.alpha) * GA })); }
function S(s, x, y, o = {}) { return T(s, x, y, Object.assign({ family: 'Noto Serif', weight: 700 }, o)); }
function fitSize(str, weight, size, maxW, family) {
  let s = size; ctx.font = `${weight} ${s}px ${family || 'Inter'}`;
  while (ctx.measureText(str).width > maxW && s > 12) { s -= 1; ctx.font = `${weight} ${s}px ${family || 'Inter'}`; }
  return s;
}
function A(a) { ctx.globalAlpha = GA * a; }
function glyph(ch, x, y, size, mode, color, rotY) {
  ctx.save(); ctx.translate(x, y);
  if (mode === 'm') ctx.scale(-1, 1);
  if (mode === 'v') ctx.scale(1, -1);
  if (rotY != null) ctx.scale(1, rotY);
  ctx.fillStyle = color; ctx.font = `700 ${size}px "Noto Serif"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, size * 0.04); ctx.restore();
}
// literă turnată, văzută din față (fața care tipărește)
function tile(x, y, w, h, ch, mode, inked, rotY) {
  ctx.fillStyle = METAL_D; roundRect(ctx, x, y, w, h, 5); ctx.fill();
  ctx.fillStyle = METAL; roundRect(ctx, x + 3, y + 3, w - 6, h - 6, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 4, y + 4, w - 8, 4);
  if (ch) glyph(ch, x + w / 2, y + h / 2 + 1, h * 0.66, mode, inked ? INK : METAL_L, rotY);
}
// linie de rând cules (văzută de sus): fâșie de metal cu „fețe de litere”
function typeRow(x, y, w, h, seed, inkFn) {
  const r = rng(seed);
  ctx.fillStyle = METAL_D; ctx.fillRect(x, y, w, h);
  let xx = x + 6;
  while (xx < x + w - 14) {
    const wl = 10 + r() * 16;
    if (r() < 0.16) { xx += 14; continue; }      // spațiu între cuvinte
    const cx = xx + wl / 2, cy = y + h / 2;
    ctx.fillStyle = inkFn && inkFn(cx, cy) ? INK : METAL_L;
    ctx.fillRect(xx, y + h * 0.22, Math.min(wl, x + w - 8 - xx), h * 0.56);
    xx += wl + 4;
  }
}
function table() { // tăblia mesei de lucru, la baza scenei
  A(1); ctx.fillStyle = WOOD_D; ctx.fillRect(80, 760, 1760, 35);
  ctx.fillStyle = 'rgba(255,220,180,.10)'; ctx.fillRect(80, 760, 1760, 3);
}
function leader(x0, y0, x1, y1, a = 1) {
  ctx.save(); A(a * .8); ctx.strokeStyle = PAL.ocru; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.fillStyle = PAL.ocru; ctx.beginPath(); ctx.arc(x1, y1, 4.5, 0, 7); ctx.fill(); ctx.restore();
}
function tag(s, x, y, a = 1, align = 'left', size = 24, color = L) { T(s, x, y, { size, weight: 600, color, align, alpha: a, shadow: 6 }); }

// ------------------------------------------------------------------ elemente comune
function inkBall(x, y, r, press) {
  const k = 1 - 0.08 * press;
  ctx.save(); ctx.translate(x, y);
  // mânerul de lemn (în sus)
  ctx.fillStyle = WOOD_L; roundRect(ctx, -13, -r * 1.9, 26, r * 1.25, 9); ctx.fill();
  ctx.fillStyle = WOOD; roundRect(ctx, -22, -r * 0.85, 44, r * 0.32, 8); ctx.fill();
  // tamponul de piele
  ctx.scale(1 / k * 1.0, k);
  ctx.fillStyle = LEATHER; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,180,.16)'; ctx.beginPath(); ctx.arc(-r * .3, -r * .3, r * .45, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(30,15,8,.55)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(0, 0, r * .78, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = INK; ctx.globalAlpha *= .55; ctx.beginPath(); ctx.ellipse(0, r * .25, r * .7, r * .5, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function sheet(x, y, w, h, o = {}) {
  ctx.fillStyle = o.color || PAPER; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(x, y + h - 4, w, 4);
  if (o.lines) {
    const r = rng(o.seed || 3), m = w * 0.12;
    ctx.fillStyle = rgba(INK, o.lineA == null ? .78 : o.lineA);
    const nl = o.lines, lh = (h - 2 * m) / nl;
    for (let i = 0; i < nl; i++) { const ww = (w - 2 * m) * (i === nl - 1 ? .55 : .86 + r() * .14); ctx.fillRect(x + m, y + m + i * lh, ww, Math.max(2, lh * .42)); }
  }
}
// presa cu șurub, văzută din lateral; s = scară; press 0..1 (placa coboară); carX = centrul carului; barTh = unghiul barei
function drawPress(cx, base, s, press, carX, barTh, shake, pkg) {
  ctx.save(); ctx.translate(cx, base); ctx.scale(s, s); ctx.translate(-960, -760);
  ctx.translate(shake || 0, 0);
  // șinele carului
  ctx.fillStyle = WOOD_D; ctx.fillRect(660, 690, 1080, 16); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(660, 706, 1080, 4);
  // carul cu forma (și coala, sub rama închisă)
  const cw = 420;
  ctx.fillStyle = '#6E6A63'; ctx.fillRect(carX - cw / 2, 656, cw, 34);        // „piatra” patului
  ctx.fillStyle = WOOD; ctx.fillRect(carX - cw / 2 - 12, 650, cw + 24, 8);
  if (pkg) { ctx.fillStyle = '#CDB892'; ctx.fillRect(carX - cw / 2 + 20, 628, cw - 40, 22); ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(carX - cw / 2 + 20, 646, cw - 40, 4); }
  // stâlpii (în față)
  ctx.fillStyle = WOOD; ctx.fillRect(700, 300, 46, 460); ctx.fillRect(1174, 300, 46, 460);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(728, 300, 18, 460); ctx.fillRect(1202, 300, 18, 460);
  // capul presei
  ctx.fillStyle = WOOD_L; ctx.fillRect(676, 318, 568, 64); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(676, 370, 568, 12);
  ctx.fillStyle = WOOD_D; ctx.fillRect(676, 740, 568, 22);
  // șurubul (dungi elicoidale care se mișcă la rotire)
  const pY = lerp(548, 626, press);
  ctx.save(); ctx.beginPath(); ctx.rect(940, 382, 40, pY - 382 - 40); ctx.clip();
  ctx.fillStyle = '#8B6B45'; ctx.fillRect(940, 382, 40, 400);
  ctx.strokeStyle = 'rgba(40,25,10,.55)'; ctx.lineWidth = 6;
  const ph = (barTh || 0) * 40;
  for (let y = 360 + (ph % 26); y < 620; y += 26) { ctx.beginPath(); ctx.moveTo(940, y); ctx.lineTo(980, y + 12); ctx.stroke(); }
  ctx.restore();
  // butucul și bara
  const by = pY - 70;
  ctx.fillStyle = IRON; ctx.fillRect(926, by - 14, 68, 32);
  const bl = 270 * Math.cos(barTh || 0), bdy = 26 * Math.sin(barTh || 0);
  ctx.strokeStyle = '#2E3238'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(990, by); ctx.lineTo(990 + bl, by + bdy); ctx.stroke();
  ctx.fillStyle = WOOD_L; ctx.beginPath(); ctx.ellipse(990 + bl, by + bdy, 16, 22, 0, 0, 7); ctx.fill();
  // placa
  ctx.fillStyle = '#5A3D26'; ctx.fillRect(840, pY - 40, 240, 12);
  ctx.fillStyle = WOOD_L; ctx.fillRect(820, pY - 28, 280, 30); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(820, pY - 2, 280, 4);
  ctx.restore();
  return { pY, by, barEnd: [990 + bl, by + bdy] };
}
function bookClosed(cx, cy, w, h, o = {}) {
  ctx.save(); ctx.translate(cx, cy); if (o.rot) ctx.rotate(o.rot);
  // paginile (muchia)
  ctx.fillStyle = PAPER_D; ctx.fillRect(-w / 2 + 10, -h / 2 + 8, w - 4, h);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-w / 2 + 12, h / 2 + 2 - i * 3, w - 8, 1); }
  // coperta
  ctx.fillStyle = o.color || LEATHER; roundRect(ctx, -w / 2, -h / 2, w, h, 8); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-w / 2, -h / 2, w * .08, h);
  ctx.strokeStyle = 'rgba(255,215,160,.45)'; ctx.lineWidth = 3;
  ctx.strokeRect(-w / 2 + w * .16, -h / 2 + h * .1, w * .74, h * .8);
  ctx.strokeRect(-w / 2 + w * .24, -h / 2 + h * .17, w * .58, h * .66);
  if (o.emblem === 'scales') {
    ctx.strokeStyle = 'rgba(255,215,160,.8)'; ctx.lineWidth = 4; const ex = w * .03;
    ctx.beginPath(); ctx.moveTo(ex, -h * .2); ctx.lineTo(ex, h * .18); ctx.moveTo(ex - w * .2, -h * .12); ctx.lineTo(ex + w * .2, -h * .12); ctx.moveTo(ex - w * .1, h * .18); ctx.lineTo(ex + w * .1, h * .18); ctx.stroke();
    for (const sx of [-1, 1]) { const px = ex + sx * w * .2; ctx.beginPath(); ctx.moveTo(px, -h * .12); ctx.lineTo(px - w * .07, h * .02); ctx.moveTo(px, -h * .12); ctx.lineTo(px + w * .07, h * .02); ctx.stroke(); ctx.beginPath(); ctx.arc(px, h * .02, w * .07, 0, Math.PI); ctx.stroke(); }
  } else if (o.emblem === 'q') {
    ctx.fillStyle = 'rgba(255,215,160,.85)'; ctx.font = `700 ${h * .36}px "Noto Serif"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', w * .03, 4);
  } else {
    ctx.fillStyle = 'rgba(255,215,160,.6)'; ctx.beginPath(); const ex = w * .03;
    ctx.moveTo(ex, -h * .14); ctx.lineTo(ex + w * .1, 0); ctx.lineTo(ex, h * .14); ctx.lineTo(ex - w * .1, 0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function bookOpen(cx, cy, w, h) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = LEATHER; roundRect(ctx, -w / 2 - 14, -h / 2 - 8, w + 28, h + 22, 10); ctx.fill();
  for (const sd of [-1, 1]) {
    ctx.fillStyle = PAPER; ctx.beginPath();
    ctx.moveTo(0, -h / 2 + 10); ctx.quadraticCurveTo(sd * w * .25, -h / 2 - 8, sd * w / 2, -h / 2); ctx.lineTo(sd * w / 2, h / 2);
    ctx.quadraticCurveTo(sd * w * .25, h / 2 - 10, 0, h / 2 + 6); ctx.closePath(); ctx.fill();
    // rânduri (fără litere: aspect imaginat)
    ctx.fillStyle = rgba('#5B4A3A', .45);
    for (let i = 0; i < 9; i++) { const yy = -h / 2 + 34 + i * (h - 70) / 9; const x0 = sd > 0 ? w * .08 : -w * .44; ctx.fillRect(x0, yy, w * .36 * (i === 8 ? .5 : 1), 6); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-3, -h / 2 + 8, 6, h);
  ctx.restore();
}

// ------------------------------------------------------------------ Partea I: cei 8 pași
const STEPS = [
  { k: 'literele', t: 'Literele turnate', b: 'Fiecare literă se toarnă dintr-un aliaj de plumb, staniu și stibiu, într-un tipar de mână cu matriță.', s: 'en.wikipedia: Movable type · Type metal' },
  { k: 'culegerea', t: 'Culegerea în vingalac', b: 'Culegătorul (zețarul) așază literele în vingalac, de la stânga la dreapta, cu susul în jos; spațiile umplu rândul.', s: 'en.wikipedia: Composing stick · dexonline: vingalac' },
  { k: 'forma', t: 'Forma', b: 'Rândurile trec pe galion, apoi se strâng bine într-o ramă de metal: forma – imaginea unei pagini.', s: 'en.wikipedia: Composing stick · Movable type · Letterpress printing · Chase (printing)' },
  { k: 'cerneala', t: 'Cerneala', b: 'Forma se acoperă cu cerneală pe bază de ulei, cu două tampoane de piele umplute cu lână sau păr de cal.', s: 'en.wikipedia: Movable type · Printing press' },
  { k: 'coala', t: 'Coala', b: 'Coala – de regulă din cârpe de cânepă și in – se umezește, se prinde în rame și se coboară pe formă.', s: 'en.wikipedia: Printing press · Papermaking' },
  { k: 'presa', t: 'Presa manuală', b: 'Se trage de bară: șurubul coboară placa, care apasă coala pe forma cu cerneală.', s: 'en.wikipedia: Printing press' },
  { k: 'uscarea', t: 'Uscarea', b: 'Colile tipărite se pun la uscat; literele se pot folosi din nou, pentru alte pagini.', s: 'en.wikipedia: Letterpress printing' },
  { k: 'legarea', t: 'Legarea', b: 'Colile se împăturesc în caiete, care se cos la cotor; coperțile – plăci îmbrăcate de obicei în piele sau pergament.', s: 'en.wikipedia: Bookbinding' },
];

function step1(u) { // literele turnate
  table();
  const mx = 760, top = 450, bot = 710, o = easeInOut(smooth(2.0, 2.4, u)) * 70;
  // lingura cu aliaj topit
  const tilt = smooth(0.15, 0.55, u) * (1 - smooth(1.45, 1.8, u));
  const ang = lerp(-0.15, 0.85, tilt);
  const lx = 640, ly = 392;
  ctx.save(); A(1); ctx.translate(lx, ly); ctx.rotate(ang);
  ctx.strokeStyle = IRON; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-50, -10); ctx.lineTo(-250, -70); ctx.stroke();
  ctx.fillStyle = WOOD; roundRect(ctx, -300, -100, 90, 30, 12); ctx.fill();
  ctx.fillStyle = IRON; ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI); ctx.lineTo(-58, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = MOLTEN; ctx.beginPath(); ctx.ellipse(0, 2, 50, 10 + 4 * (1 - tilt), 0, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(GLOW, .7); ctx.beginPath(); ctx.ellipse(-8, 0, 26, 5, 0, 0, 7); ctx.fill();
  ctx.restore();
  // jetul de metal topit
  const pour = smooth(0.5, 0.65, u) * (1 - smooth(1.4, 1.55, u));
  if (pour > 0.01) {
    const sx = lx + Math.cos(ang) * 56, sy = ly + Math.sin(ang) * 56;
    ctx.save(); A(pour);
    const g = ctx.createLinearGradient(sx, sy, mx, top + 10); g.addColorStop(0, GLOW); g.addColorStop(1, MOLTEN);
    ctx.strokeStyle = g; ctx.lineWidth = 9 + 2 * Math.sin(u * 40); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 50, sy + 10, mx, top + 6); ctx.stroke();
    ctx.globalAlpha = GA * pour * .35; ctx.fillStyle = GLOW; ctx.beginPath(); ctx.arc(mx, top + 10, 30, 0, 7); ctx.fill();
    ctx.restore();
  }
  // tiparul de mână: două jumătăți (lemn peste fier), cavitatea în secțiune
  A(1);
  for (const sd of [-1, 1]) {
    const x0 = sd < 0 ? mx - 100 - o : mx + o;
    ctx.fillStyle = WOOD; ctx.fillRect(x0, top, 100, bot - top);
    ctx.fillStyle = IRON; ctx.fillRect(sd < 0 ? x0 + 58 : x0, top + 30, 42, bot - top - 80);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(sd < 0 ? x0 : x0 + 88, top, 12, bot - top);
    // pâlnia
    ctx.fillStyle = IRON; ctx.beginPath();
    if (sd < 0) { ctx.moveTo(x0 + 40, top); ctx.lineTo(x0 + 100, top); ctx.lineTo(x0 + 100, top + 30); ctx.lineTo(x0 + 78, top + 30); ctx.closePath(); }
    else { ctx.moveTo(x0, top); ctx.lineTo(x0 + 60, top); ctx.lineTo(x0 + 22, top + 30); ctx.lineTo(x0, top + 30); ctx.closePath(); }
    ctx.fill();
  }
  // matrița (cupru) la baza cavității
  ctx.fillStyle = COPPER; ctx.fillRect(mx - 48 - o * .2, bot - 50, 96, 40);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(mx - 16 - o * .2, bot - 50, 32, 10);
  // metalul din cavitate
  const fill = smooth(0.6, 1.45, u), cool = smooth(1.5, 2.1, u);
  const cavTop = top + 30, cavBot = bot - 50, ch = (cavBot - cavTop) * fill;
  // litera turnată pleacă spre dreapta după deschidere
  const mv = easeInOut(smooth(2.35, 2.95, u));
  const sxp = lerp(mx, 1040, mv), syb = lerp(cavBot, 760, mv);
  if (ch > 0) {
    const col = mix(MOLTEN, METAL, cool);
    if (mv <= 0) { ctx.fillStyle = col; ctx.fillRect(mx - 20, cavBot - ch, 40, ch); if (cool < 1) { A(1 - cool); ctx.fillStyle = rgba(GLOW, .5); ctx.fillRect(mx - 20, cavBot - ch, 40, 8); A(1); } }
    else {
      const hh = cavBot - cavTop;
      ctx.fillStyle = METAL_D; ctx.fillRect(sxp - 22, syb - hh, 44, hh);
      ctx.fillStyle = METAL; ctx.fillRect(sxp - 18, syb - hh, 36, hh);
      ctx.fillStyle = METAL_D; ctx.fillRect(sxp - 22, syb - hh * .3, 44, 6); // crestătura
      ctx.fillStyle = METAL_L; ctx.fillRect(sxp - 14, syb - hh - 8, 28, 10); // fața literei, în relief
    }
  }
  // lupa: fața literei, în oglindă
  const za = smooth(2.7, 3.05, u);
  if (za > 0) {
    ctx.save(); A(za);
    ctx.strokeStyle = PAL.ocru; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(1068, 600); ctx.lineTo(1300, 540); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#26323F'; ctx.beginPath(); ctx.arc(1440, 520, 140, 0, 7); ctx.fill();
    ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(1440, 520, 140, 0, 7); ctx.stroke();
    tile(1370, 450, 140, 140, 'R', 'm', false);
    ctx.restore();
    tag('fața literei: în oglindă', 1440, 712, za, 'center');
    T('pe hârtie se tipărește corect: R', 1440, 748, { size: 22, color: PAL.ceata, align: 'center', alpha: za });
  }
  // etichete
  tag('aliaj topit: plumb + staniu + stibiu', 820, 372, smooth(0.3, 0.7, u));
  const la = smooth(0.4, 0.8, u);
  tag('tipar de mână', 540, 560, la, 'right'); leader(548, 552, mx - 100 - o, 552, la);
  tag('matrița (litera adâncită)', 540, 690, la, 'right'); leader(548, 682, mx - 48, 682, la);
  tag('litera turnată', 1040, 552, smooth(2.75, 3.0, u), 'center', 22, PAL.ceata);
}

const WORD = ['S', 'I', 'B', 'I', 'U'];
const CASE = { x: 380, y: 320, cols: 12, rows: 2, cw: 96.6, chh: 76 };
const CASE_LET = 'ABCDEFGHILMNOPRSTUVXZ.,;:-!?';
function caseCell(ch) { const i = CASE_LET.indexOf(ch); return [i % CASE.cols, Math.floor(i / CASE.cols)]; }
function drawCase(x, y, cols, rows, cw, chh, labels) {
  ctx.fillStyle = WOOD; roundRect(ctx, x - 12, y - 12, cols * cw + 24, rows * chh + 24, 8); ctx.fill();
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const cx = x + i * cw, cy = y + j * chh;
    ctx.fillStyle = '#2A1D12'; ctx.fillRect(cx + 3, cy + 3, cw - 6, chh - 6);
    ctx.fillStyle = 'rgba(160,170,180,.55)'; for (let k = 0; k < 4; k++) ctx.fillRect(cx + 10 + k * (cw - 26) / 4, cy + chh - 24, (cw - 26) / 4 - 4, 14);
    if (labels) { const c = CASE_LET[i + j * cols]; if (c) T(c, cx + 10, cy + 26, { size: 18, weight: 600, color: PAL.ceata }); }
  }
}
function step2(u) { // culegerea în vingalac
  table(); A(1);
  drawCase(CASE.x, CASE.y, CASE.cols, CASE.rows, CASE.cw, CASE.chh, true);
  // vingalacul
  const sx0 = 560, sx1 = 1360, sy = 620;
  ctx.fillStyle = '#B9C1C8'; ctx.fillRect(sx0, sy + 70, sx1 - sx0, 16);
