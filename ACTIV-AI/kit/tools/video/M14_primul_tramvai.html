<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>M14</title></head><body>
<script src="lib.js"></script>
<script>
const W = 1920, H = 1080, ctx = setupCanvas(W, H);
// etape: [t_start, t_end, an, titlu scurt, text]
const STAGES = [
  [3, 10, '1905', 'inaugurarea primei linii', 'Piața Gării – Parcul Sub Arini (zona Spitalului Militar). Vagoane aduse de la Budapesta, linie construită de o firmă din Budapesta.'],
  [10, 16, '1910', 'prelungire spre Dumbrava', '15 mai 1910: linia ajunge până la marginea Pădurii Dumbrava.'],
  [16, 22, '1912', 'Piața Cibin', '10 august 1912: Piața Gării – Piața Cibin, în Orașul de Jos.'],
  [22, 28, '1925', 'parcul de vagoane', '14 vagoane-motor, cu 30 de locuri fiecare (16 pe scaun). În primii 20 de ani: 3.950.197 de călători.'],
  [28, 34, '1927', 'Turnișor și Piața Cluj', '25 septembrie 1927: Piața Cibin – gara Turnișor și Piața Cluj.'],
  [34, 40, '1948', 'linia spre Rășinari', '14 martie 1948: inaugurarea liniei interurbane Sibiu (Dumbrava) – Rășinari.'],
  [40, 44, '1966–1967', 'tramvaiul dispare din oraș', '1966: Turnișor gară – Piața Cibin; 1967: Piața Cibin – Gară. Rămâne doar linia spre Rășinari.'],
];
const TEND = 44; // cartelă finală 44–50 s
// nod: [x, y, etichetă, aliniere, dx, dy]
const NODES = { gara: [1700, 490, 'Piața Gării', 'left', 20, 8], spital: [1500, 610, 'Spitalul Militar · Sub Arini', 'left', 20, 8], dumbrava: [1400, 700, 'Pădurea Dumbrava', 'left', 20, 8], cibin: [1560, 440, 'Piața Cibin', 'left', 20, -14], turnisor: [1290, 480, 'gara Turnișor', 'center', 0, 36], cluj: [1450, 420, 'Piața Cluj', 'center', 0, -22], rasinari: [1300, 810, 'Rășinari', 'left', 20, 8] };
const LINKS = [['gara', 'spital', 3.5], ['spital', 'dumbrava', 10.5], ['gara', 'cibin', 16.5], ['cibin', 'turnisor', 28.5], ['cibin', 'cluj', 29.5], ['dumbrava', 'rasinari', 34.5]];
const CITY = ['gara', 'spital', 'dumbrava', 'cibin', 'turnisor', 'cluj'];

function tram(x, y, s, t, alpha, wireY) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = alpha;
  // troleu către firul aerian
  const topY = -190, wy = (wireY - y) / s;
  ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-10, topY); ctx.lineTo(-90, wy + 6); ctx.stroke();
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(-90, wy + 6, 7, 0, 7); ctx.fill();
  if (Math.sin(t * 13) > .93) { ctx.fillStyle = rgba('#CFE8FF', .9); ctx.beginPath(); ctx.arc(-90, wy + 2, 10, 0, 7); ctx.fill(); }
  // acoperiș
  ctx.fillStyle = '#4A4A46'; roundRect(ctx, -165, topY, 330, 26, 12); ctx.fill();
  ctx.fillStyle = '#3B4A3F'; roundRect(ctx, -150, topY - 14, 300, 20, 10); ctx.fill();
  // caroserie: partea de sus crem, partea de jos verde închis
  ctx.fillStyle = '#E6DCC4'; roundRect(ctx, -170, -170, 340, 100, 10); ctx.fill();
  ctx.fillStyle = '#3B4A3F'; roundRect(ctx, -170, -80, 340, 60, 8); ctx.fill();
  ctx.fillStyle = '#2A3630'; ctx.fillRect(-172, -22, 344, 8);
  // ferestre
  for (let i = 0; i < 6; i++) { ctx.fillStyle = '#2A3442'; roundRect(ctx, -150 + i * 52, -158, 40, 70, 5); ctx.fill(); ctx.fillStyle = 'rgba(243,239,230,.25)'; ctx.fillRect(-146 + i * 52, -154, 10, 62); }
  // uși la capete (linii)
  ctx.strokeStyle = '#6B6B60'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-160, -170); ctx.lineTo(-160, -20); ctx.moveTo(160, -170); ctx.lineTo(160, -20); ctx.stroke();
  // număr de linie (stilizat) și far
  ctx.fillStyle = '#F3EFE6'; roundRect(ctx, -22, -200, 44, 24, 6); ctx.fill(); text(ctx, '1', 0, -181, { size: 20, weight: 800, align: 'center', color: PAL.night });
  ctx.fillStyle = '#FFD27A'; ctx.beginPath(); ctx.arc(166, -50, 9, 0, 7); ctx.fill();
  // boghiuri și roți
  ctx.fillStyle = '#2A2A2A'; ctx.fillRect(-140, -14, 90, 16); ctx.fillRect(50, -14, 90, 16);
  for (const wx of [-120, -70, 70, 120]) { ctx.fillStyle = '#1A1A1A'; ctx.beginPath(); ctx.arc(wx, 8, 20, 0, 7); ctx.fill(); ctx.strokeStyle = '#888'; ctx.lineWidth = 3; const a0 = x * .05; ctx.beginPath(); ctx.moveTo(wx + Math.cos(a0) * 14, 8 + Math.sin(a0) * 14); ctx.lineTo(wx - Math.cos(a0) * 14, 8 - Math.sin(a0) * 14); ctx.stroke(); }
  // apărător față
  ctx.strokeStyle = '#2A2A2A'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(150, -10); ctx.lineTo(185, 10); ctx.lineTo(150, 30); ctx.stroke();
  ctx.restore();
}
function stopSign(x, y, label, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#4A4A46'; ctx.fillRect(x - 4, y - 230, 8, 230);
  ctx.fillStyle = '#E6DCC4'; roundRect(ctx, x - 100, y - 290, 200, 60, 8); ctx.fill();
  text(ctx, label, x, y - 252, { size: 20, weight: 700, align: 'center', color: PAL.night }); ctx.restore();
}
function street(t, si, lt, gray) {
  const dayOf = [.33, .5, .62, .45, .7, .4, .78][Math.max(0, si)]; const season = [1, 2, 1, 1, 2, 0, 2][Math.max(0, si)];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1160, H); ctx.clip();
  const s = sky(ctx, 1160, H, dayOf, season);
  mountains(ctx, 1160, 560, mix('#6B7F95', '#0A1020', .25), 2, 90);
  const scroll = -(t * 90) % 2200;
  for (const off of [scroll, scroll + 2200]) { ctx.save(); ctx.translate(off, 0); houses(ctx, { seed: 51 + si, y0: 700, W: 2200, x0: -40, walls: ['#D8C6A6', '#E6DAC2', '#CDB89A', '#C9B79C'], roofs: ['#8A4A35', '#A05A3A', '#6B4A35'], tint: '#2B3A55', tintAmt: .25 - s.light * .2, t, wallH: 150 }); ctx.restore(); }
  // trotuar, drum, șine
  ctx.fillStyle = '#9A9282'; ctx.fillRect(0, 700, 1160, 50);
  ctx.fillStyle = '#5E5A52'; ctx.fillRect(0, 750, 1160, 330);
  ctx.fillStyle = '#4A463F'; for (let x = (scroll * 1.0) % 60; x < 1160; x += 60) ctx.fillRect(x, 846, 36, 14);
  ctx.strokeStyle = '#B8B2A6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, 842); ctx.lineTo(1160, 842); ctx.moveTo(0, 862); ctx.lineTo(1160, 862); ctx.stroke();
  // stâlpi și fir aerian
  ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 6; for (let x = ((scroll * 1.0) % 500 + 500) % 500 - 100; x < 1260; x += 500) { ctx.beginPath(); ctx.moveTo(x, 700); ctx.lineTo(x, 300); ctx.lineTo(x + 120, 330); ctx.stroke(); }
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 345); ctx.lineTo(1160, 345); ctx.stroke();
  if (gray > 0) { ctx.fillStyle = `rgba(90,85,78,${gray * .7})`; ctx.fillRect(0, 0, 1160, H); }
  ctx.restore();
  return s;
}
window.render = function (t) {
  ctx.fillStyle = PAL.night; ctx.fillRect(0, 0, W, H);
  let si = -1; for (let i = 0; i < STAGES.length; i++) if (t >= STAGES[i][0]) si = i;
  const st = STAGES[Math.max(0, si)], lt = t - st[0], sd = st[1] - st[0];
  const a = si < 0 ? 0 : Math.min(smooth(0, .5, lt), 1 - smooth(sd - .4, sd, lt));
  const gray = si === 6 ? smooth(.5, 2.5, lt) : 0;
  street(t, si, lt, gray);
  // tramvaiul
  let tx, talpha = 1;
  if (si <= 0) { tx = lerp(-200, 980, easeInOut(inv(3.5, 9.5, t))); stopSign(230, 700, 'Piața Gării', 1); stopSign(1000, 700, 'Spitalul Militar', 1); }
  else if (si === 6) { tx = lerp(400, 620, easeOut(inv(0, 2.5, lt))); talpha = 1 - smooth(2, 3.5, lt); }
  else tx = 600 + Math.sin(t * .7) * 40;
  const shake = Math.sin(t * 17) * 1.5;
  if (talpha > 0) tram(tx, 836 + shake, 1.15, t, talpha, 345);
  if (si === 6 && talpha < .5) text(ctx, 'șinele din oraș au fost scoase', 580, 940, { size: 28, color: PAL.var, align: 'center', alpha: 1 - talpha, weight: 600 });

  // panou dreapta: an, etapă, schemă
  ctx.fillStyle = 'rgba(15,23,32,.92)'; ctx.fillRect(1160, 0, 760, H);
  ctx.fillStyle = rgba('#1B2733', .9); roundRect(ctx, 1200, 130, 680, 870, 36); ctx.fill();
  if (si < 0) {
    const ia = 1 - smooth(2.4, 3, t);
    serif(ctx, 'Primul tramvai', 1240, 330, { size: 72, alpha: ia }); serif(ctx, 'electric din Sibiu', 1240, 410, { size: 72, alpha: ia });
    serif(ctx, '1905', 1240, 600, { size: 190, color: PAL.ocru, alpha: smooth(.5, 1.5, t) * ia });
    text(ctx, 'reconstituire animată · schematic, nu la scară', 1240, 660, { size: 26, color: PAL.ceata, alpha: ia });
  } else {
    serif(ctx, st[2], 1240, 290, { size: st[2].length > 4 ? 96 : 150, color: si === 6 ? PAL.ceata : PAL.ocru, alpha: a });
    text(ctx, st[3], 1240, 340, { size: 32, weight: 600, color: PAL.var, alpha: a });
    // schema rețelei
    if (si === 3) { // 1925: 14 vagoane
      const n = 14; for (let i = 0; i < n; i++) { const p = smooth(.3 + i * .18, .8 + i * .18, lt); if (p > 0) tram(1300 + (i % 7) * 90, 500 + Math.floor(i / 7) * 120, .25, t, a * p, 500 + Math.floor(i / 7) * 120 - 60); }
      text(ctx, '14 vagoane-motor', 1540, 660, { size: 30, weight: 700, align: 'center', alpha: a * smooth(2.8, 3.3, lt) });
      // 30 de locuri: 16 scaune + 14 în picioare
      for (let i = 0; i < 30; i++) { const p = smooth(3 + i * .05, 3.4 + i * .05, lt); ctx.save(); ctx.globalAlpha = a * p; ctx.fillStyle = i < 16 ? PAL.ocru : PAL.ceata; roundRect(ctx, 1260 + (i % 15) * 38, 700 + Math.floor(i / 15) * 40, 28, 28, 6); ctx.fill(); ctx.restore(); }
      text(ctx, '30 de locuri într-un vagon: 16 pe scaun (ocru), 14 în picioare', 1260, 810, { size: 22, color: PAL.ceata, alpha: a * smooth(3.5, 4, lt) });
    } else {
      ctx.save();
      for (const [n1, n2, ts] of LINKS) { const p = easeInOut(inv(ts, ts + 1.6, t)); if (p <= 0) continue; const A = NODES[n1], B = NODES[n2]; const dead = si === 6 && CITY.includes(n2) && n2 !== 'rasinari' ? smooth(.5, 2.5, lt) : 0; ctx.strokeStyle = dead > 0 ? mix(PAL.ocru, '#5A5A5A', dead) : PAL.ocru; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.setLineDash(dead > .5 ? [10, 12] : []); ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(lerp(A[0], B[0], p), lerp(A[1], B[1], p)); ctx.stroke(); ctx.setLineDash([]); }
      for (const k in NODES) { const [x, y, lab, al, dx, dy] = NODES[k]; const ts = LINKS.find(l => l[1] === k) ? LINKS.find(l => l[1] === k)[2] + 1.2 : 3.2; const p = smooth(ts, ts + .5, t); if (p <= 0) continue; const dead = si === 6 && k !== 'rasinari' && k !== 'dumbrava' ? smooth(.5, 2.5, lt) : 0; ctx.fillStyle = dead > 0 ? mix(PAL.var, '#5A5A5A', dead) : PAL.var; ctx.beginPath(); ctx.arc(x, y, 11 * p, 0, 7); ctx.fill(); ctx.fillStyle = PAL.night; ctx.beginPath(); ctx.arc(x, y, 5 * p, 0, 7); ctx.fill(); text(ctx, lab, x + dx, y + dy, { size: 22, align: al, color: dead > 0 ? mix(PAL.ceata, '#5A5A5A', dead) : PAL.ceata, alpha: p }); }
      // puls pe tronsonul nou
      const cur = LINKS.filter(l => l[2] >= st[0] && l[2] < st[1]); for (const [n1, n2] of cur) { const A = NODES[n1], B = NODES[n2], q = (lt * .6) % 1; ctx.fillStyle = PAL.var; ctx.beginPath(); ctx.arc(lerp(A[0], B[0], q), lerp(A[1], B[1], q), 7, 0, 7); ctx.fill(); }
      ctx.restore();
      text(ctx, 'schemă, nu la scară', 1840, 830, { size: 20, color: 'rgba(169,180,192,.6)', align: 'right' });
    }
    text(ctx, st[4], 1240, 890, { size: 26, maxW: 600, lh: 36, alpha: a, color: PAL.var });
  }
  // cartela finală
  const ea = smooth(TEND, TEND + 1, t);
  if (ea > 0) {
    ctx.fillStyle = `rgba(15,23,32,${.985 * ea})`; ctx.fillRect(0, 0, W, H);
    serif(ctx, 'Primul tramvai electric din Sibiu (1905)', W / 2, 380, { size: 72, align: 'center', alpha: ea });
    text(ctx, 'Data inaugurării: 8 septembrie 1905, conform patrimoniu.sibiu.ro; alte surse (tribuna.ro) indică 9 august 1905.', W / 2, 460, { size: 30, align: 'center', color: PAL.var, alpha: ea, maxW: 1500, lh: 40 });
    text(ctx, 'Surse: patrimoniu.sibiu.ro (Tramvaiul), tursib.ro, turnulsfatului.ro (2015), tribuna.ro. Vagonul, străzile și schema rețelei sunt stilizate; traseul nu este la scară.', W / 2, 540, { size: 26, align: 'center', color: PAL.ceata, alpha: ea, maxW: 1500, lh: 36 });
    text(ctx, 'Animație generată cu AI · sunet: A12, reconstituire sonoră a tramvaiului (sinteză) · artefact-model ACTIV AI', W / 2, 640, { size: 26, align: 'center', color: PAL.ceata, alpha: ea });
    tram(W / 2, 905, .8, t, ea, 700);
  }
  ctx.fillStyle = 'rgba(10,16,28,.55)'; ctx.fillRect(0, 0, W, 110);
  chip(ctx, 'VIDEO · M14', 60, 36, PAL.red);
  text(ctx, 'Primul tramvai electric din Sibiu (1905) · reconstituire animată', 270, 64, { size: 30, weight: 600 });
  ctx.fillStyle = 'rgba(10,16,28,.6)'; ctx.fillRect(0, H - 60, W, 60);
  footer(ctx, W, H, 'M14');
};
window.READY = true;
</script></body></html>
