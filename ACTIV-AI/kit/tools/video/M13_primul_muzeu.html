<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>M13</title></head><body>
<script src="lib.js"></script>
<script>
const W = 1920, H = 1080, ctx = setupCanvas(W, H);
// scene: [t_start, t_end, an afișat, text narator]
const SCENES = [
  [0, 4, '', 'Povestea primului muzeu din România începe cu un om și cu colecțiile lui.'],
  [4, 13, '1721–1803', 'Samuel von Brukenthal (1721–1803) a fost guvernator al Transilvaniei între 1777 și 1787.'],
  [13, 22, 'Piața Mare', 'Palatul său din Piața Mare a devenit casa colecțiilor: tablouri, cărți, gravuri, monede și minerale.'],
  [22, 31, 'c. 1790', 'Colecțiile încep în jurul anului 1790, când pot fi vizitate pentru prima dată.'],
  [31, 40, '1817', 'În 1817 are loc deschiderea publică oficială: Muzeul Brukenthal, primul muzeu din România.'],
  [40, 49, 'în cifre', 'Galeria de artă: circa 1.200 de lucrări ale școlilor europene din secolele XV–XVIII. Biblioteca: aproximativ 300.000 de unități.'],
  [49, 54, '1803', 'Samuel von Brukenthal a murit în 1803 și este înmormântat în Catedrala Evanghelică din Sibiu.'],
];
const TEND = 54; // cartela finală 54–60 s
const R = rng(21);
// „tablouri”: dreptunghiuri colorate în rame goale – nu reproduc opere reale
const FRAMES = []; { const r = rng(3); const cols = ['#2E4A5A', '#6B4A35', '#3E5A3A', '#5A3A4A', '#4A5A6B', '#7A6A3A', '#3A4A7A', '#6B3A3A', '#4A6B5A', '#5A5A3A', '#3A3A5A', '#7A5A4A'];
  for (let i = 0; i < 12; i++) FRAMES.push({ c: cols[i], w: 120 + r() * 120, h: 110 + r() * 110, land: r() > .5 }); }

function frame(x, y, w, h, col, a, gold) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = gold || '#C9A24A'; ctx.fillRect(x - 10, y - 10, w + 20, h + 20);
  ctx.fillStyle = '#8A6A2A'; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, mix(col, '#F3EFE6', .25)); g.addColorStop(1, mix(col, '#000000', .3)); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  // sugestie abstractă de compoziție (fără conținut recognoscibil)
  ctx.fillStyle = 'rgba(243,239,230,.12)'; ctx.beginPath(); ctx.ellipse(x + w * .5, y + h * .62, w * .28, h * .3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y + h * .7, w, h * .3);
  ctx.restore();
}
function palace(x, base, wdt, p, a) { // palat baroc schematic – trei niveluri, portal central, acoperiș înalt
  ctx.save(); ctx.globalAlpha = a;
  const hgt = 420 * p; ctx.beginPath(); ctx.rect(x - wdt / 2 - 40, base - 1000, wdt + 80, 1000 - (1000 - hgt) * 0 ); ctx.clip();
  ctx.beginPath(); ctx.rect(0, base - hgt - 160, W, hgt + 160 + 400); ctx.clip();
  ctx.fillStyle = '#E3D2B4'; ctx.fillRect(x - wdt / 2, base - 420, wdt, 420);
  ctx.fillStyle = '#5B3A2E'; ctx.beginPath(); ctx.moveTo(x - wdt / 2 - 20, base - 420); ctx.lineTo(x - wdt / 2 + 80, base - 560); ctx.lineTo(x + wdt / 2 - 80, base - 560); ctx.lineTo(x + wdt / 2 + 20, base - 420); ctx.closePath(); ctx.fill();
  // cornișe
  ctx.fillStyle = '#C9B48E'; ctx.fillRect(x - wdt / 2 - 8, base - 420, wdt + 16, 14); ctx.fillRect(x - wdt / 2, base - 280, wdt, 8); ctx.fillRect(x - wdt / 2, base - 150, wdt, 8);
  // ferestre pe 3 niveluri
  const n = 9, step = wdt / n;
  for (let lvl = 0; lvl < 3; lvl++) for (let i = 0; i < n; i++) {
    const wx = x - wdt / 2 + (i + .5) * step - 22, wy = base - 395 + lvl * 135;
    if (lvl === 2 && i === 4) continue;
    ctx.fillStyle = '#B8A07A'; ctx.fillRect(wx - 6, wy - 8, 56, 100);
    ctx.fillStyle = '#2A3442'; ctx.fillRect(wx, wy, 44, 84);
    ctx.fillStyle = 'rgba(243,239,230,.25)'; ctx.fillRect(wx + 20, wy, 3, 84); ctx.fillRect(wx, wy + 40, 44, 3);
    if (lvl === 1) { ctx.fillStyle = '#B8A07A'; ctx.beginPath(); ctx.moveTo(wx - 10, wy - 8); ctx.lineTo(wx + 22, wy - 30); ctx.lineTo(wx + 54, wy - 8); ctx.closePath(); ctx.fill(); }
  }
  // portal central
  ctx.fillStyle = '#9C8A6A'; ctx.fillRect(x - 60, base - 160, 120, 160); ctx.fillStyle = '#1a1410'; ctx.beginPath(); ctx.moveTo(x - 40, base); ctx.lineTo(x - 40, base - 100); ctx.arc(x, base - 100, 40, Math.PI, 0); ctx.lineTo(x + 40, base); ctx.fill();
  // lucarne pe acoperiș
  for (let i = 0; i < 4; i++) eye(ctx, x - wdt / 2 + 150 + i * (wdt - 300) / 3, base - 500, 60, '#4A2E24', { open: 1, glow: 0 });
  ctx.restore();
}
function visitor(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, -150, 18, 0, 7); ctx.fill(); roundRect(ctx, -20, -130, 40, 86, 12); ctx.fill(); ctx.fillRect(-17, -46, 13, 46); ctx.fillRect(4, -46, 13, 46); ctx.restore(); }
function hallWall(a) { // perete de galerie cu lambriu
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5A3A3A'); g.addColorStop(1, '#3A2626'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2A1E1A'; ctx.fillRect(0, 800, W, 300); ctx.fillStyle = '#4A3A2A'; for (let x = -200; x < W + 200; x += 160) { ctx.beginPath(); ctx.moveTo(x, 800); ctx.lineTo(x - 200, H); ctx.lineTo(x - 50, H); ctx.lineTo(x + 150, 800); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#C9A24A'; ctx.fillRect(0, 790, W, 10);
  ctx.restore();
}
function shelf(x, y, w, h, p, seed) { // raft de bibliotecă umplut treptat
  const r = rng(seed); ctx.fillStyle = '#4A3222'; ctx.fillRect(x - 10, y - 10, w + 20, h + 20);
  const rows = 5, rh = h / rows; let count = 0, total = 0;
  for (let j = 0; j < rows; j++) { let bx = x + 4; while (bx < x + w - 12) { const bw = 12 + r() * 14, bh = rh * (.7 + r() * .25); total++; if (count / 70 < p) { ctx.fillStyle = ['#7A3A2A', '#2E4A5A', '#6B5A2A', '#3E5A3A', '#5A3A4A', '#8A6A3A'][Math.floor(r() * 6)]; ctx.fillRect(bx, y + (j + 1) * rh - bh - 4, bw, bh); } count++; bx += bw + 2; } ctx.fillStyle = '#6B4A35'; ctx.fillRect(x, y + (j + 1) * rh - 4, w, 6); }
}
window.render = function (t) {
  ctx.fillStyle = PAL.night; ctx.fillRect(0, 0, W, H);
  let si = 0; for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i][0]) si = i;
  const [s0, s1, yr, line] = SCENES[si]; const lt = t - s0, sd = s1 - s0;
  const a = t >= TEND ? 0 : Math.min(smooth(0, .6, lt), 1 - smooth(sd - .5, sd, lt));

  if (si === 0) { // intro: ramă goală care se luminează
    const g = ctx.createRadialGradient(W / 2, 480, 50, W / 2, 480, 900); g.addColorStop(0, '#2A2030'); g.addColorStop(1, PAL.night); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    frame(W / 2 - 260, 230, 520, 420, '#3A3A5A', smooth(.3, 1.5, lt), '#C9A24A');
    serif(ctx, 'Povestea primului muzeu', W / 2, 460, { size: 64, align: 'center', alpha: smooth(1, 2, lt) });
    text(ctx, 'din România', W / 2, 520, { size: 40, align: 'center', color: PAL.ceata, alpha: smooth(1.3, 2.3, lt) });
  }
  if (si === 1) { // portret-siluetă în ramă ovală (stilizat, nu reproducere)
    hallWall(1);
    ctx.save(); ctx.translate(560, 440);
    ctx.fillStyle = '#C9A24A'; ctx.beginPath(); ctx.ellipse(0, 0, 230, 300, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2A3442'; ctx.beginPath(); ctx.ellipse(0, 0, 205, 275, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 205, 275, 0, 0, 7); ctx.clip();
    const p = smooth(.4, 1.6, lt);
    ctx.fillStyle = rgba('#F3EFE6', .18 * p); ctx.beginPath(); ctx.ellipse(0, 300, 190, 260, 0, Math.PI, 0); ctx.fill(); // umeri
    ctx.fillStyle = rgba('#F3EFE6', .3 * p); ctx.beginPath(); ctx.ellipse(0, -60, 92, 118, 0, 0, 7); ctx.fill(); // cap (siluetă generică)
    ctx.fillStyle = rgba('#F3EFE6', .3 * p); ctx.beginPath(); ctx.ellipse(0, -130, 120, 70, 0, Math.PI, 0); ctx.fill(); // perucă stilizată
    ctx.restore(); ctx.restore();
    text(ctx, 'siluetă stilizată, nu portret real', 560, 775, { size: 22, align: 'center', color: PAL.ceata, alpha: a });
    serif(ctx, 'Samuel von Brukenthal', 980, 400, { size: 64, alpha: a * smooth(.6, 1.4, lt) });
    serif(ctx, '1721–1803', 980, 500, { size: 90, color: PAL.ocru, alpha: a * smooth(1, 1.8, lt) });
    text(ctx, 'guvernator al Transilvaniei', 980, 570, { size: 34, color: PAL.ceata, alpha: a * smooth(1.6, 2.4, lt) });
    serif(ctx, '1777–1787', 980, 650, { size: 64, color: PAL.var, alpha: a * smooth(2, 2.8, lt) });
  }
  if (si === 2) { // palatul în Piața Mare
    const g = ctx.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, '#2B3A55'); g.addColorStop(1, '#8FA3B8'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    stars(ctx, W, H, .25, 5);
    houses(ctx, { seed: 31, y0: 720, W, x0: -40, walls: ['#D8C6A6', '#E6DAC2', '#CDB89A'], roofs: ['#8A4A35', '#A05A3A'], tint: '#2B3A55', tintAmt: .45, t, wallH: 150 });
    ctx.fillStyle = '#6E6A60'; ctx.fillRect(0, 720, W, 400);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let y = 740; y < H; y += 36) for (let x = (y / 36 % 2) * 40; x < W; x += 80) ctx.fillRect(x, y, 70, 26);
    palace(960, 720, 900, smooth(.2, 1.8, lt), 1);
    for (let k = 0; k < 4; k++) visitor(300 + k * 110 + Math.sin(lt + k) * 10, 760 + k * 20, .8 + k * .1, '#2B2622');
    text(ctx, 'Piața Mare · palat schematic, nu la scară', W - 80, 160, { size: 24, align: 'right', color: PAL.var, alpha: a });
  }
  if (si === 3 || si === 4) { // galeria: ramele apar una câte una
    hallWall(1);
    const base = si === 3 ? smooth(0, 6, lt) : 1;
    let x = 120; const r = rng(9);
    FRAMES.forEach((f, i) => { const fa = si === 3 ? smooth(i * .45 + .3, i * .45 + 1.1, lt) : 1; const y = 300 + (i % 2) * 40 - f.h / 2 + (f.land ? 60 : 0); const fw = f.land ? f.w * 1.25 : f.w; frame(x, y, fw, f.h, f.c, fa); x += fw + 60; });
    if (si === 3) { serif(ctx, 'c. 1790', 160, 720, { size: 110, color: PAL.ocru, alpha: a }); text(ctx, 'colecțiile pot fi vizitate', 160, 770, { size: 32, color: PAL.ceata, alpha: a }); }
    if (si === 4) {
      // ușă deschisă + vizitatori care intră
      const open = smooth(.3, 2.2, lt);
      ctx.fillStyle = '#1a1410'; ctx.fillRect(1500, 440, 260, 360); ctx.fillStyle = '#C9A24A'; ctx.fillRect(1490, 430, 280, 10); ctx.fillRect(1490, 430, 10, 370); ctx.fillRect(1760, 430, 10, 370);
      ctx.fillStyle = '#5B3A2E'; ctx.fillRect(1500, 440, 130 * (1 - open * .9), 360); ctx.fillRect(1760 - 130 * (1 - open * .9), 440, 130 * (1 - open * .9), 360);
      const vis = ['#2B2622', '#4A3A2A', '#3A2A3A', '#2A3A4A', '#5A4A3A'];
      for (let k = 0; k < 5; k++) { const vp = smooth(1 + k * .9, 3.5 + k * .9, lt); const vx = lerp(1630, 560 + k * 220, vp); if (vp > 0) visitor(vx, 820 + (k % 2) * 30, .9 + (k % 3) * .1, vis[k]); }
      serif(ctx, '1817', 160, 690, { size: 150, color: PAL.ocru, alpha: a });
      text(ctx, 'deschiderea publică oficială', 160, 738, { size: 34, color: PAL.var, alpha: a });
      text(ctx, 'primul muzeu din România', 160, 780, { size: 34, color: PAL.ceata, alpha: a });
    }
  }
  if (si === 5) { // cifre: rame + bibliotecă
    hallWall(1);
    const p = smooth(.3, 5, lt);
    ctx.save(); ctx.globalAlpha = a;
    serif(ctx, 'circa 1.200', 120, 300, { size: 80, color: PAL.ocru }); text(ctx, 'de lucrări, școli europene, secolele XV–XVIII', 120, 350, { size: 30, color: PAL.var, maxW: 760, lh: 40 });
    // perete de rame mici
    const r = rng(17); let n = 0;
    for (let j = 0; j < 4; j++) for (let i = 0; i < 6; i++) { const fa = smooth(n * .1, n * .1 + .6, lt); frame(120 + i * 130, 400 + j * 95, 100, 70, FRAMES[(i + j) % 12].c, fa); n++; }
    serif(ctx, 'aproximativ 300.000', 1000, 300, { size: 80, color: PAL.petrol }); text(ctx, 'de unități în Biblioteca Brukenthal: manuscrise, incunabule, cărți rare, carte românească veche', 1000, 350, { size: 30, color: PAL.var, maxW: 800, lh: 40 });
    shelf(1000, 440, 800, 340, p, 4);
    ctx.restore();
  }
  if (si === 6) { // catedrala evanghelică – siluetă cu turn înalt
    const s = sky(ctx, W, H, .78, 3); stars(ctx, W, H, .2, 4);
    mountains(ctx, W, 700, mix('#6B7F95', '#0A1020', .5), 2, 110);
    houses(ctx, { seed: 41, y0: 820, W, walls: ['#C9B79C', '#B8A58A'], roofs: ['#6B3A2E', '#7A4A35'], tint: '#0A1020', tintAmt: .55, t, wallH: 120 });
    ctx.fillStyle = mix('#B8A58A', '#0A1020', .5); ctx.fillRect(760, 520, 420, 320); ctx.fillStyle = mix('#5B3A2E', '#0A1020', .5); ctx.beginPath(); ctx.moveTo(740, 520); ctx.lineTo(970, 400); ctx.lineTo(1200, 520); ctx.fill();
    tower(ctx, 640, 840, 110, 560, { wall: mix('#C9B79C', '#0A1020', .45), roof: mix('#4A2E24', '#0A1020', .4), roofH: 260, clock: true });
    for (let k = 0; k < 6; k++) { ctx.fillStyle = 'rgba(20,24,30,.7)'; ctx.beginPath(); ctx.moveTo(800 + k * 60, 820); ctx.lineTo(800 + k * 60, 650); ctx.arc(815 + k * 60, 650, 15, Math.PI, 0); ctx.lineTo(830 + k * 60, 820); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    serif(ctx, '1803', 1300, 400, { size: 150, color: PAL.ceata, alpha: a });
    text(ctx, 'Catedrala Evanghelică Sf. Maria', 1300, 460, { size: 34, color: PAL.var, alpha: a });
    text(ctx, 'siluetă schematică', 1300, 500, { size: 22, color: PAL.ceata, alpha: a });
  }

  // caseta narator (text pe ecran, fără voce)
  if (t < TEND) {
    ctx.fillStyle = `rgba(10,16,28,${.82 * a})`; roundRect(ctx, 80, H - 230, 1760, 140, 28); ctx.fill();
    if (yr) { ctx.fillStyle = rgba(PAL.ocru, a); roundRect(ctx, 110, H - 202, 190, 84, 18); ctx.fill(); text(ctx, yr, 205, H - 147, { size: yr.length > 7 ? 26 : 34, weight: 800, align: 'center', color: PAL.night, alpha: a }); }
    const x0 = yr ? 330 : 120; ctx.font = '600 34px Inter'; const two = ctx.measureText(line).width > (1700 - x0 + 80);
    text(ctx, line, x0, two ? H - 170 : H - 148, { size: 34, weight: 600, alpha: a, maxW: 1780 - x0, lh: 44 });
  }
  // cartela finală
  const ea = smooth(TEND, TEND + 1, t);
  if (ea > 0) {
    ctx.fillStyle = `rgba(15,23,32,${.985 * ea})`; ctx.fillRect(0, 0, W, H);
    serif(ctx, 'Povestea primului muzeu din România', W / 2, 400, { size: 72, align: 'center', alpha: ea });
    text(ctx, 'Samuel von Brukenthal (1721–1803) · colecții vizitabile din jurul anului 1790 · deschidere publică oficială 1817', W / 2, 480, { size: 30, align: 'center', color: PAL.ceata, alpha: ea });
    text(ctx, 'Surse: patrimoniu.sibiu.ro (Premiere); en.wikipedia.org (Brukenthal National Museum). Tablourile sunt rame stilizate, nu reproduceri ale operelor; palatul și catedrala sunt scheme.', W / 2, 560, { size: 26, align: 'center', color: PAL.ceata, alpha: ea, maxW: 1500, lh: 36 });
    text(ctx, 'Animație generată cu AI · text pe ecran, fără voce · muzică: peisajul sonor A03 · artefact-model ACTIV AI', W / 2, 680, { size: 26, align: 'center', color: PAL.ceata, alpha: ea });
    for (let i = 0; i < 7; i++) frame(560 + i * 120, 760, 80, 60, FRAMES[i].c, ea);
  }
  ctx.fillStyle = 'rgba(10,16,28,.55)'; ctx.fillRect(0, 0, W, 110);
  chip(ctx, 'VIDEO · M13', 60, 36, PAL.red);
  text(ctx, 'Povestea primului muzeu din România · Muzeul Brukenthal', 270, 64, { size: 30, weight: 600 });
  ctx.fillStyle = 'rgba(10,16,28,.6)'; ctx.fillRect(0, H - 60, W, 60);

};
window.READY = true;
