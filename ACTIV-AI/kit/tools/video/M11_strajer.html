<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>M11</title></head><body>
<script src="lib.js"></script>
<script>
const W = 1920, H = 1080, ctx = setupCanvas(W, H);
const SD = 7.5; // 8 scene × 7,5 s = 60 s
const SCENES = [
  ['04:50', 'Urc în Turnul Pânzarilor înainte de zori. Sunt Matthes, calfă de pânzar – și, în noaptea asta, străjer.'],
  ['05:30', 'Gurile de tragere au formă de gaură de cheie. Prin ele, orașul se vede în felii înguste.'],
  ['07:00', 'Clopotul bisericii. Jos, pe Strada Cetății, se deschid atelierele; Turnul Olarilor și Turnul Dulgherilor își fac umbră unul altuia.'],
  ['10:00', 'Breasla ne trimite pâine și brânză. Un meșter verifică archebuzele – fiecare breaslă răspunde de turnul ei.'],
  ['13:00', 'Negustori la poartă. Verific încărcătura, nu fețele. Cetatea e deschisă pentru cine vine cu treabă.'],
  ['17:00', 'Reparăm acoperișul: țigle noi lângă cele vechi. Zidarul zgârie în piatră anul – 1668.'],
  ['21:00', 'Se închid porțile. Pe ziduri se aprind felinarele, unul câte unul, până la Bastionul Haller.'],
  ['00:00', 'Miezul nopții. Strig ora peste oraș. Cineva, undeva, doarme mai liniștit.'],
];
function towerOct(x, base, w, h, col, roof, t, night, glow) {
  // prismă octogonală cu partea de sus pe console
  ctx.save();
  ctx.fillStyle = col; ctx.fillRect(x - w / 2, base - h * .62, w, h * .62);
  ctx.fillStyle = mix(col, '#000', .12); ctx.fillRect(x - w / 2 - 14, base - h, w + 28, h * .38);
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(x - w / 2 - 14 + k * (w + 28) / 5, base - h * .62); ctx.lineTo(x - w / 2 + k * w / 5, base - h * .56); ctx.lineTo(x - w / 2 + 6 + k * w / 5, base - h * .56); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + w * .2, base - h, w * .3 + 14, h);
  // guri de tragere gaură de cheie
  for (let k = 0; k < 3; k++) { const gx = x - w * .3 + k * w * .3, gy = base - h * .82; ctx.fillStyle = glow ? '#FFD27A' : '#1a1410'; ctx.beginPath(); ctx.arc(gx, gy, 7, 0, 7); ctx.fill(); ctx.fillRect(gx - 3, gy, 6, 26); }
  ctx.fillStyle = roof; ctx.beginPath(); ctx.moveTo(x - w / 2 - 24, base - h); ctx.lineTo(x, base - h - w * 1.1); ctx.lineTo(x + w / 2 + 24, base - h); ctx.fill();
  ctx.restore();
}
function wallSeg(x0, x1, base, hgt, col, night) {
  ctx.fillStyle = col; ctx.fillRect(x0, base - hgt, x1 - x0, hgt + 300);
  ctx.fillStyle = mix(col, '#000', .15); for (let x = x0; x < x1; x += 70) ctx.fillRect(x, base - hgt - 36, 40, 40);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2; for (let y = base - hgt + 20; y < base + 300; y += 40) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
  if (night > 0) for (let x = x0 + 60; x < x1; x += 180) { ctx.fillStyle = rgba('#FFD27A', night); ctx.beginPath(); ctx.arc(x, base - hgt + 30, 8, 0, 7); ctx.fill(); const g = ctx.createRadialGradient(x, base - hgt + 30, 4, x, base - hgt + 30, 70); g.addColorStop(0, rgba('#FFD27A', .45 * night)); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - 70, base - hgt - 40, 140, 140); }
}
function guard(x, y, s, t, lantern) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#2B2622'; ctx.beginPath(); ctx.arc(0, -150, 20, 0, 7); ctx.fill(); roundRect(ctx, -22, -128, 44, 84, 12); ctx.fill(); ctx.fillRect(-18, -46, 14, 46); ctx.fillRect(4, -46, 14, 46);
  ctx.fillStyle = '#4A3A2A'; ctx.fillRect(-26, -176, 52, 12); // pălărie
  ctx.strokeStyle = '#8A7A66'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(30, -200); ctx.lineTo(30, 0); ctx.stroke(); // halebardă
  ctx.fillStyle = '#B8B2A6'; ctx.beginPath(); ctx.moveTo(30, -200); ctx.lineTo(44, -230); ctx.lineTo(30, -250); ctx.lineTo(16, -230); ctx.fill();
  if (lantern) { const f = .8 + Math.sin(t * 9) * .2; ctx.fillStyle = rgba('#FFD27A', f); ctx.fillRect(-48, -120, 16, 22); const g = ctx.createRadialGradient(-40, -110, 4, -40, -110, 90); g.addColorStop(0, rgba('#FFD27A', .5 * f)); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(-140, -210, 200, 200); }
  ctx.restore();
}
window.render = function (t) {
  const i = Math.min(8, Math.floor(t / SD)), lt = t - i * SD, a = Math.min(smooth(0, .6, lt), 1 - smooth(SD - .5, SD, lt));
  const dayOf = [.17, .23, .3, .42, .5, .67, .85, .0][Math.min(i, 7)];
  const s = sky(ctx, W, H, dayOf, 1); stars(ctx, W, H, clamp(-s.sun * 1.6) * .9, 9);
  const night = clamp(-s.sun * 2 + .25), tint = '#0A1020', ta = clamp(.75 - s.light * .9, 0, .7);
  if (s.sun > -.2) { const ang = (dayOf - .25) * Math.PI * 2; ctx.fillStyle = mix('#FFB347', '#FFF4C8', s.light); ctx.beginPath(); ctx.arc(W * .5 - Math.cos(ang) * W * .5, H * .8 - Math.sin(ang) * H * .6, 46, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#F3EFE6'; ctx.beginPath(); ctx.arc(1500, 150, 40, 0, 7); ctx.fill(); }
  mountains(ctx, W, 600, mix('#6B7F95', tint, ta), 2, 130);
  const wallC = mix('#C9B79C', tint, ta * .9), roofC = mix('#5B3A2E', tint, ta * .8);
  if (i === 0 || i === 7) { // interior turn / sus pe turn noaptea
    wallSeg(0, W, 760, 180, wallC, night);
    towerOct(560, 760, 170, 520, wallC, roofC, t, night, i === 7);
    towerOct(1500, 760, 150, 440, wallC, roofC, t, night, false);
    guard(1000, 760, 1.3, t, i === 7 || i === 0);
    if (i === 7) { const p = (lt % 2.5) / 2.5; ctx.strokeStyle = rgba(PAL.ocru, 1 - p); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(1000, 560, 40 + p * 220, -.9, .3); ctx.stroke(); }
  }
  if (i === 1) { // vedere prin gaura de cheie
    ctx.fillStyle = '#0A0806'; ctx.fillRect(0, 0, W, H);
    ctx.save(); const kp = new Path2D(); kp.arc(W / 2, 400, 170 + Math.sin(lt) * 6, 0, 7); kp.rect(W / 2 - 80, 400, 160, 420); ctx.clip(kp, 'nonzero');
    sky(ctx, W, H, dayOf, 1); mountains(ctx, W, 600, mix('#6B7F95', tint, ta), 2, 130);
    houses(ctx, { seed: 77, y0: 820, W, walls: ['#E8D3B0', '#F0E4CF'], roofs: ['#A94F33', '#B9583A'], tint, tintAmt: ta, t, wallH: 130 });
    ctx.restore();
    ctx.strokeStyle = 'rgba(120,100,80,.6)'; ctx.lineWidth = 6; ctx.stroke(new Path2D(`M ${W/2-170} 400 A 170 170 0 1 1 ${W/2+170} 400`));
  }
  if (i === 2 || i === 3 || i === 5) { // Strada Cetății cu cele trei turnuri
    wallSeg(0, W, 780, 200, wallC, 0);
    towerOct(300, 780, 150, 470, wallC, roofC, t, 0, false);
    // Olarilor dreptunghiular cu retragere
    ctx.fillStyle = wallC; ctx.fillRect(880, 500, 170, 580); ctx.fillStyle = mix(wallC, '#000', .1); ctx.fillRect(892, 330, 146, 180); ctx.fillStyle = roofC; ctx.beginPath(); ctx.moveTo(870, 330); ctx.lineTo(965, 220); ctx.lineTo(1060, 330); ctx.fill();
    for (let k = 0; k < 5; k++) { ctx.fillStyle = '#1a1410'; ctx.fillRect(905 + k * 28, 380, 8, 30); }
    // Dulgherilor: bază circulară → octogon
    ctx.fillStyle = wallC; ctx.beginPath(); ctx.ellipse(1560, 780, 95, 30, 0, 0, 7); ctx.fill(); ctx.fillRect(1465, 420, 190, 360); ctx.fillStyle = mix(wallC, '#000', .1); ctx.fillRect(1475, 240, 170, 180); ctx.fillStyle = roofC; ctx.beginPath(); ctx.moveTo(1450, 240); ctx.lineTo(1560, 60); ctx.lineTo(1670, 240); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(1600, 240, 55, 540); ctx.fillRect(1000, 330, 50, 750);
    ctx.fillStyle = '#8A7A66'; ctx.fillRect(0, 1000, W, 80);
    if (i === 3) { ctx.fillStyle = '#C8954F'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(620 + k * 60, 985, 28, 14, 0, 0, 7); ctx.fill(); } guard(760, 1000, 1.1, t, false); guard(560, 1000, 1.0, t, false); }
    if (i === 2) guard(1200, 1000, 1.1, t, false);
    if (i === 5) { ctx.strokeStyle = '#6B4A35'; ctx.lineWidth = 8; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(180 + k * 60, 1000); ctx.lineTo(260 + k * 60, 320); ctx.stroke(); } ctx.fillStyle = '#B9583A'; for (let k = 0; k < 8; k++) ctx.fillRect(200 + k * 30, 300 - (k % 2) * 10, 24, 14); serif(ctx, '1668', 330, 700, { size: 46, color: '#3B2A20' }); guard(520, 1000, 1.0, t, false); }
  }
  if (i === 4) { // poarta cu negustori
    wallSeg(0, W, 700, 240, wallC, 0);
    ctx.fillStyle = mix('#B9583A', tint, ta * .5); ctx.fillRect(760, 300, 400, 780); ctx.fillStyle = roofC; ctx.beginPath(); ctx.moveTo(740, 300); ctx.lineTo(960, 120); ctx.lineTo(1180, 300); ctx.fill();
    ctx.fillStyle = '#1a1410'; ctx.beginPath(); ctx.moveTo(860, 1080); ctx.lineTo(860, 760); ctx.arc(960, 760, 100, Math.PI, 0); ctx.lineTo(1060, 1080); ctx.fill();
    ctx.fillStyle = '#8A7A66'; ctx.fillRect(0, 1000, W, 80);
    const cx = 300 + lt * 60; ctx.fillStyle = '#6B4A35'; ctx.fillRect(cx, 900, 180, 70); ctx.fillStyle = '#C8954F'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(cx + 40 + k * 50, 890, 24, 0, 7); ctx.fill(); } ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(cx + 30, 985, 26, 0, 7); ctx.arc(cx + 150, 985, 26, 0, 7); ctx.fill();
    guard(1120, 1000, 1.1, t, false); guard(cx + 230, 1000, 1.0, t, false);
  }
  if (i === 6) { // felinare se aprind
    wallSeg(0, W, 760, 200, wallC, smooth(0, 5, lt));
    towerOct(400, 760, 150, 480, wallC, roofC, t, night, true);
    ctx.fillStyle = mix('#9C8A70', tint, ta); ctx.beginPath(); ctx.moveTo(1500, 760); ctx.lineTo(1540, 520); ctx.lineTo(1920, 500); ctx.lineTo(1920, 1080); ctx.lineTo(1500, 1080); ctx.fill(); text(ctx, 'Bastionul Haller (început 1551)', 1560, 480, { size: 22, color: PAL.ceata });
    guard(1000, 760, 1.2, t, true);
  }
  if (i === 8) {
    ctx.fillStyle = '#0F1720'; ctx.fillRect(0, 0, W, H);
    serif(ctx, 'O zi din viața unui străjer', W / 2, 440, { size: 84, align: 'center', alpha: a });
    text(ctx, 'Scurt metraj imaginat · personaj fictiv (Matthes, calfă de pânzar, 1668)', W / 2, 520, { size: 32, align: 'center', color: PAL.ceata, alpha: a });
    text(ctx, 'Fapte: Turnul Archebuzierilor (1357–1366, 20,75 m, numit ulterior Turnul Pânzarilor, anul 1668 inscripționat), Turnul Olarilor, Turnul Dulgherilor, Bastionul Haller – patrimoniu.sibiu.ro', W / 2, 590, { size: 24, align: 'center', color: PAL.ceata, alpha: a, maxW: 1400, lh: 34 });
    text(ctx, 'Scenariu, ilustrație și animație generate cu AI · sunet: peisajul sonor A09 · artefact-model ACTIV AI', W / 2, 700, { size: 26, align: 'center', color: PAL.ceata, alpha: a });
  }
  if (i < 8) {
    ctx.fillStyle = 'rgba(0,0,0,' + (1 - a) + ')'; ctx.fillRect(0, 0, W, H);
    const [hh, line] = SCENES[i];
    ctx.fillStyle = `rgba(10,16,28,${.8 * a})`; roundRect(ctx, 80, H - 240, 1760, 150, 28); ctx.fill();
    ctx.fillStyle = rgba(PAL.ocru, a); roundRect(ctx, 110, H - 212, 150, 94, 20); ctx.fill();
    text(ctx, hh, 185, H - 150, { size: 44, weight: 800, align: 'center', color: PAL.night, alpha: a });
    ctx.font = '600 36px Inter'; const two = ctx.measureText(line).width > 1500;
    text(ctx, line, 290, two ? H - 176 : H - 152, { size: 36, weight: 600, alpha: a, maxW: 1500, lh: 46 });
  }
  ctx.fillStyle = 'rgba(10,16,28,.55)'; ctx.fillRect(0, 0, W, 110);
  chip(ctx, 'VIDEO · M11', 60, 36, PAL.red);
  text(ctx, 'O zi din viața unui străjer din turn · scurt metraj imaginat, 1668', 270, 64, { size: 30, weight: 600 });
  ctx.fillStyle = 'rgba(10,16,28,.6)'; ctx.fillRect(0, H - 60, W, 60);
  footer(ctx, W, H, 'M11');
};
window.READY = true;
</script></body></html>
