function perch(T, dx, dy, minD) { let best = null, bd = 1e9; for (const s of T.segs) { if (s.d < (minD || 2)) continue; const d = Math.hypot(s.x1 - (T.x + dx), s.y1 - (T.base + dy)); if (d < bd) { bd = d; best = s; } } return best; }

function crownRow(seed, y, rmin, rmax, step, n) { const r = rng(seed), out = []; let x = -60; while (x < W + 60) { const rr = rmin + r() * (rmax - rmin); out.push({ x, y: y + (r() - .5) * 26 - rr * .3, r: rr, v: r() }); x += step * (.6 + r() * .7); } return out; }

function drawRow(row, col, haze, hazeCol, snow) {

}
function edgeY(x) { return 628 + 9 * Math.sin(x * .004 + 1) + 6 * Math.sin(x * .011); }
const PATCH = (() => { const r = rng(17), a = []; for (let i = 0; i < 70; i++) a.push({ x: r() * W, y: 640 + r() * 420, rx: 60 + r() * 160, ry: 14 + r() * 30, th: r() * .7 + .05 }); return a; })();
const LIT = (() => { const r = rng(19), a = []; for (let i = 0; i < 420; i++) a.push({ x: r() * W, y: 640 + Math.pow(r(), .8) * 440, r: 2 + r() * 3.5, v: r(), a: r() * 3 }); return a; })();
const TUFT = (() => { const r = rng(23), a = []; for (let i = 0; i < 190; i++) a.push({ x: r() * W, y: 650 + Math.pow(r(), .7) * 420, h: 10 + r() * 18, n: 3 + Math.floor(r() * 3), v: r() }); return a; })();

function drawGround(m, t, snow) {

  ctx.fillStyle = pc; ctx.beginPath(); ctx.moveTo(1010, H); ctx.bezierCurveTo(960, 930, 1180, 820, 1110, 700); ctx.quadraticCurveTo(1090, 660, 1150, 640); ctx.lineTo(1166, 640); ctx.quadraticCurveTo(1112, 666, 1132, 702); ctx.bezierCurveTo(1220, 830, 1040, 930, 1150, H); ctx.closePath(); ctx.fill();

}

window.render = function (t) {

  ctx.fillStyle = '#FFF6DA'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 7); ctx.fill();

  // ghinde
  const ac = kf(C.acorn, m); if (ac > .02) for (const k of ['oakR', 'oakL']) { const T = TREES[k]; let i = 0; for (const b of T.blobs) { if (i++ % 5) continue; if (b.v > ac || b.th > oak) continue; ctx.fillStyle = mix('#7A8A3A', '#7A5228', clamp((m - 8.6) / 1.2)); ctx.beginPath(); ctx.ellipse(b.x + 6, b.y + 8, 3.2, 4.4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#5A4028'; ctx.beginPath(); ctx.ellipse(b.x + 6, b.y + 4.6, 3.6, 1.8, 0, 0, 7); ctx.fill(); } }
  // stejarul tânăr (frunze uscate peste iarnă) și arbuștii
  { const T = TREES.young; drawBranches(T, snow); drawCrown(T, .62 * kf(C.marc, m), 3, 1, '#A8743E'); drawCrown(T, oak, ph, 1); }
  for (const k of ['porumbar', 'paducel']) { const T = TREES[k]; drawBranches(T, snow); drawCrown(T, early, ph, 1); }
  drawFlowers(TREES.porumbar, kf(C.porumbar, m), '#FFFFFF', t);
  drawFlowers(TREES.paducel, kf(C.paducel, m), '#FFFFFF', t);
  drawTufts(m, t, snow);
  drawCrocus(m, t);
  // puieții (1754 – ilustrație)
  const sp = smooth(10.1, 10.5, m); sapling(860, 788, sp, m, snow); sapling(1010, 800, smooth(10.25, 10.65, m), m, snow);
  tag(935, 660, 'doi puieți de stejar · ilustrație', smooth(10.25, 10.45, m) * (1 - smooth(10.9, 10.98, m)));
  animals(m, t, 'tree');
  animals(m, t, 'front');
  particles(m, t);
  bottomBox(t, m);
  // intro
  const ia = 1 - smooth(3.3, 4, t);
  if (ia > 0) {
    ctx.save(); ctx.globalAlpha = ia * .8; const gg = ctx.createLinearGradient(0, 300, 0, 720); gg.addColorStop(0, 'rgba(15,23,32,0)'); gg.addColorStop(.25, 'rgba(15,23,32,.9)'); gg.addColorStop(.75, 'rgba(15,23,32,.9)'); gg.addColorStop(1, 'rgba(15,23,32,0)'); ctx.fillStyle = gg; ctx.fillRect(0, 300, W, 420); ctx.restore();
