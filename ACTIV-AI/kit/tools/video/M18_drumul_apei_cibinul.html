  if (t > T0 && t < T0 + 3.4) { const [x, y] = posAt(0); text(ctx, 'picătură · personaj imaginat', x - 40, y + 52, { size: 20, color: PAL.ocru, weight: 600, alpha: smooth(T0 + .4, T0 + 1, t) * (1 - smooth(T0 + 2.8, T0 + 3.4, t)) }); }
  // contorul de kilometri
  const km = Math.round(82 * s), fin = s > .999;
  text(ctx, 'kilometri parcurși (contor orientativ)', 120, 934, { size: 20, color: PAL.ceata, weight: 600, alpha: ma });
  serif(ctx, (fin || km === 0 ? '' : '≈ ') + km + ' km', 920, 940, { size: 40, color: PAL.ocru, align: 'right', alpha: ma * smooth(T0, T0 + .6, t) });
  ctx.save(); ctx.globalAlpha = ma; ctx.fillStyle = 'rgba(169,180,192,.2)'; roundRect(ctx, 120, 956, 800, 10, 5); ctx.fill(); ctx.fillStyle = WATER; if (s > 0) { roundRect(ctx, 120, 956, Math.max(10, 800 * s), 10, 5); ctx.fill(); }
  SSTOP.forEach((v, i) => { ctx.fillStyle = s >= v - 1e-4 && t >= T0 ? STOPS[i].col : PAL.slate; ctx.strokeStyle = STOPS[i].col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(120 + 800 * v, 961, 7, 0, 7); ctx.fill(); ctx.stroke(); }); ctx.restore();
  text(ctx, '0', 120, 990, { size: 18, color: PAL.ceata, alpha: ma }); text(ctx, '82 km', 920, 990, { size: 18, color: PAL.ceata, alpha: ma, align: 'right' });
}

window.render = function (t) {
  ctx.fillStyle = PAL.night; ctx.fillRect(0, 0, W, H);
  const gr = ctx.createRadialGradient(1420, 500, 60, 1420, 500, 1000); gr.addColorStop(0, '#1C2836'); gr.addColorStop(1, PAL.night); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  const s = progress(Math.min(t, TEND)), k = Math.min(7, Math.max(-1, Math.floor((t - T0) / SD)));
  drawMap(t, s, k);
  ctx.fillStyle = PAL.slate; roundRect(ctx, 1000, 130, 840, 560, 32); ctx.fill();
  ctx.fillStyle = PAL.slate; roundRect(ctx, 1000, 710, 840, 290, 28); ctx.fill();
  if (k < 0) { // intro
    const a = smooth(.2, 1, t) * (1 - smooth(3.5, 4.1, t));
    serif(ctx, 'Drumul apei', 1060, 320, { size: 84, alpha: a });
    serif(ctx, 'Cibinul în 60 de secunde', 1060, 410, { size: 56, color: PAL.ocru, alpha: a });
    text(ctx, 'O picătură imaginată coboară pe Cibin,', 1064, 490, { size: 30, color: PAL.var, alpha: a });
    text(ctx, 'de la izvor până la vărsarea în Olt.', 1064, 532, { size: 30, color: PAL.var, alpha: a });
    dropChar(ctx, 1700, 560, 1.1 * smooth(.6, 1.4, t), t, { wave: t > 1.4, look: -1 });
    text(ctx, 'Opririle', 1040, 772, { size: 24, weight: 700, color: PAL.ceata, alpha: a });
    text(ctx, 'izvorul · Cheile Cibinului · Gura Râului · Orlat · Sibiu · Veștem · Tălmaciu · Podu Olt', 1040, 818, { size: 26, weight: 600, maxW: 770, lh: 36, alpha: a });
    text(ctx, 'Hartă schematică, poziții aproximative – nu la scară.', 1040, 950, { size: 22, color: PAL.ceata, alpha: a });
  } else if (t < TEND) {
    const st = STOPS[k], T = T0 + k * SD, lt = t - T;
    const ta = k === 0 ? 0 : smooth(T - .1, T + .3, t) * (1 - smooth(T + 1.2, T + 1.7, t));
    if (ta > 0) { text(ctx, 'mai departe, spre', 1420, 370, { size: 32, align: 'center', color: PAL.ceata, alpha: ta }); serif(ctx, st.name, 1420, 460, { size: 72, align: 'center', color: st.col === '#3E63DD' ? '#7D98F0' : st.col === '#6E56CF' ? '#9A86E8' : st.col, alpha: ta }); }
    const i0 = k === 0 ? 0 : 1.3;
    const ia = smooth(T + i0, T + i0 + .7, t) * (1 - smooth(T + SD - .45, T + SD, t));
    if (ia > 0) {
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, PW, PH);
      ILL[k](lt - i0, t);
      ctx.save(); roundRect(ctx, 1000, 130, 840, 560, 32); ctx.clip(); ctx.globalAlpha = ia; ctx.drawImage(off, 1000, 130); ctx.restore();
      ctx.save(); ctx.globalAlpha = ia; ctx.strokeStyle = rgba(st.col, .7); ctx.lineWidth = 3; roundRect(ctx, 1000, 130, 840, 560, 32); ctx.stroke(); ctx.restore();
    }
    const fa = smooth(T + i0 + .3, T + i0 + 1, t) * (1 - smooth(T + SD - .45, T + SD, t));
    if (fa > 0) {
      ctx.save(); ctx.globalAlpha = fa; ctx.fillStyle = st.col; ctx.fillRect(1000, 740, 8, 230); ctx.restore();
      text(ctx, `oprirea ${k + 1} din 8`, 1040, 752, { size: 22, weight: 600, color: PAL.ceata, alpha: fa });
      serif(ctx, st.name, 1040, 800, { size: 46, alpha: fa });
      const n1 = text(ctx, st.f1, 1040, 842, { size: 24, maxW: 770, lh: 31, color: PAL.var, alpha: fa * smooth(T + i0 + .6, T + i0 + 1.2, t) });
      text(ctx, st.f2, 1040, 842 + n1 * 31 + 8, { size: 24, maxW: 770, lh: 31, color: PAL.var, alpha: fa * smooth(T + i0 + 1.8, T + i0 + 2.4, t) });
      text(ctx, 'Sursă: ' + st.src, 1040, 985, { size: 20, color: PAL.ceata, alpha: fa });
    }
  }
  // cartela finală
  const ea = smooth(TEND, TEND + 1, t);
  if (ea > 0) {
    ctx.fillStyle = `rgba(15,23,32,${.97 * ea})`; ctx.fillRect(0, 0, W, H);
    serif(ctx, 'Drumul apei: Cibinul în 60 de secunde', W / 2, 270, { size: 64, align: 'center', alpha: ea });
    serif(ctx, '82 km · bazin 2.194 km²', W / 2, 400, { size: 92, align: 'center', color: PAL.ocru, alpha: ea });
    text(ctx, 'de la izvorul din Munții Cindrel până la vărsarea în Olt, lângă Tălmaciu', W / 2, 460, { size: 30, align: 'center', color: PAL.var, alpha: ea });
    serif(ctx, 'Hartă schematică, poziții aproximative – nu la scară', W / 2, 570, { size: 42, align: 'center', color: PAL.var, alpha: ea });
    text(ctx, 'Picăturile sunt personaje imaginate, iar ilustrațiile sunt imaginate. Contorul de kilometri este orientativ: doar lungimea totală (82 km) vine din surse.', W / 2, 630, { size: 26, align: 'center', color: PAL.ceata, alpha: ea, maxW: 1500, lh: 36 });
    text(ctx, 'Surse: en.wikipedia.org (Cibin; Sadu; Cindrel Mountains); muntii-nostri.ro (Cheile Cibinului); zilesinopti.ro (2024, promenada Cibinului).', W / 2, 730, { size: 26, align: 'center', color: PAL.ceata, alpha: ea, maxW: 1500, lh: 36 });
    text(ctx, 'Animație generată cu AI · muzică: temă originală, sintetizată în cod · artefact-model ACTIV AI', W / 2, 830, { size: 24, align: 'center', color: PAL.ceata, alpha: ea });
    dropChar(ctx, W / 2, 940, .7 * ea, t, { wave: true });
  }
  ctx.fillStyle = 'rgba(10,16,28,.55)'; ctx.fillRect(0, 0, W, 110);
  chip(ctx, 'VIDEO · M18', 60, 36, PAL.red);
  text(ctx, 'Drumul apei: Cibinul în 60 de secunde · animație', 270, 64, { size: 30, weight: 600 });
  ctx.fillStyle = 'rgba(10,16,28,.6)'; ctx.fillRect(0, H - 60, W, 60);
  footer(ctx, W, H, 'M18');
};
