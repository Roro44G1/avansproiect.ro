<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsula timpului</title>
<style>
:root {
  --noapte:#0F1720; --ardezie:#1B2733; --petrol:#0E7C86; --violet:#6E56CF; --ocru:#E2A62B;
  --tigla:#B9583A; --var:#F3EFE6; --ceata:#A9B4C0; --zid:#F5F1EA; --identitate:#F76B15;
  --serif:"Noto Serif", Georgia, serif; --sans:"Inter", system-ui, sans-serif;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--noapte); color:var(--var); font-family:var(--sans); font-size:22px; line-height:1.45;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
header { padding:24px clamp(16px,4vw,80px) 6px; }
.chip { display:inline-block; background:var(--identitate); color:var(--noapte); font-weight:700; letter-spacing:2px;
  font-size:18px; padding:8px 20px; border-radius:22px; }
h1 { font-family:var(--serif); font-weight:700; font-size:clamp(30px,3.4vw,58px); line-height:1.12; margin:12px 0 2px; }
.lead { color:var(--ceata); margin:0; font-size:clamp(20px,1.4vw,24px); }
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px clamp(16px,4vw,80px); }
.stage { position:relative; width:min(100%, calc((100vh - 372px) * 2)); min-width:280px; aspect-ratio:2 / 1;
  background:radial-gradient(ellipse at 50% 78%, rgba(110,86,207,.22), transparent 60%), var(--ardezie);
  border-radius:24px; overflow:hidden; }
.stars { position:absolute; inset:0; background-image:radial-gradient(rgba(243,239,230,.5) 1.2px, transparent 1.6px);
  background-size:46px 46px; opacity:.25; }
.beam { position:absolute; left:50%; bottom:23.5%; width:80%; height:78%; transform:translateX(-50%) scaleY(.2); clip-path:polygon(44.6% 100%, 55.4% 100%, 100% 0, 0 0);
  transform-origin:50% 100%; background:linear-gradient(to top, rgba(255,213,138,.55), rgba(226,166,43,.18) 45%, rgba(110,86,207,0) 100%);
  opacity:0; transition:opacity .8s ease, transform .9s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
.capsule { position:absolute; left:50%; bottom:-2%; width:15%; transform:translateX(-50%); border:0; padding:0; background:none;
  cursor:pointer; }
.capsule svg { width:100%; height:auto; display:block; overflow:visible; }
#lid { transition:transform 1s cubic-bezier(.3,1.4,.4,1); transform-box:view-box; }
.open #lid { transform:translate(150px,-70px) rotate(32deg); transform-origin:150px 92px; }
.glowin { opacity:0; transition:opacity .6s ease .3s; }
.open .glowin { opacity:1; }
.open .beam { opacity:1; transform:translateX(-50%) scaleY(1); }
.obj { position:absolute; left:50%; top:74%; width:clamp(84px,9.5%,170px); transform:translate(-50%,-50%) scale(.2);
  opacity:0; pointer-events:none; border:0; background:none; color:var(--var); font-family:var(--sans); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; padding:0; transition:left .9s cubic-bezier(.2,.9,.25,1) var(--d),
  top .9s cubic-bezier(.2,.9,.25,1) var(--d), transform .9s cubic-bezier(.2,.9,.25,1) var(--d), opacity .5s ease var(--d); }
.open .obj { left:var(--x); top:var(--y); transform:translate(-50%,-30%) scale(1); opacity:1; pointer-events:auto; }
.bubble { width:100%; aspect-ratio:1; border-radius:50%; background:var(--noapte); border:4px solid var(--c);
  display:grid; place-items:center; box-shadow:0 10px 26px rgba(0,0,0,.45); transition:transform .2s ease, box-shadow .2s ease; }
.obj-big .bubble { border-width:6px; transform:scale(1.12); }
.bubble svg { width:82%; height:82%; }
.obj:hover .bubble, .obj:focus-visible .bubble { transform:scale(1.08); box-shadow:0 0 0 6px rgba(226,166,43,.35), 0 10px 26px rgba(0,0,0,.45); }
.obj.seen .bubble::after { content:""; }
.obj.seen .lbl::after { content:" ✓"; color:var(--ocru); }
.lbl { margin-top:10px; font-weight:700; font-size:clamp(18px,1.25vw,24px); line-height:1.15; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.sub { font-size:clamp(15px,1vw,20px); color:var(--ceata); white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; margin:14px 0 4px; }
.btn { min-height:64px; min-width:56px; padding:0 30px; border-radius:32px; border:0; font:700 24px var(--sans); cursor:pointer;
  background:var(--ocru); color:var(--noapte); box-shadow:0 6px 18px rgba(0,0,0,.35); }
.btn.ghost { background:transparent; color:var(--var); border:2px solid var(--ceata); }
.btn:focus-visible, .obj:focus-visible, .capsule:focus-visible, .close:focus-visible { outline:4px solid var(--ocru); outline-offset:4px; }
.status { color:var(--ceata); font-size:22px; min-height:32px; text-align:center; }
.overlay { position:fixed; inset:0; background:rgba(5,8,12,.72); display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:10; opacity:0; pointer-events:none; transition:opacity .3s ease; }
.overlay.show { opacity:1; pointer-events:auto; }
.card { position:relative; width:min(860px,100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--ardezie);
  border-radius:24px; padding:36px clamp(20px,4vw,48px) 32px; border-top:8px solid var(--c, var(--ocru));
  transform:translateY(20px) scale(.97); transition:transform .35s cubic-bezier(.2,.9,.25,1); }
.overlay.show .card { transform:none; }
.card .ic { flex:none; width:110px; height:110px; background:var(--noapte); border-radius:50%; display:grid; place-items:center; border:4px solid var(--c, var(--ocru)); }
.card .ic svg { width:84%; height:84%; }
.card h2 { font-family:var(--serif); font-size:clamp(28px,2.4vw,42px); margin:0 0 4px; line-height:1.2; }
.card .s { color:var(--ocru); font-weight:600; margin:0 0 18px; }
.card p { font-size:clamp(20px,1.35vw,24px); margin:0 0 14px; }
.card.letter { background:var(--zid); color:#1B2733; border-top-color:var(--violet);
  background-image:repeating-linear-gradient(transparent 0 43px, rgba(14,124,134,.12) 43px 44px); }
.card.letter h2 { color:#1B2733; }
.card.letter p { font-family:var(--serif); font-size:clamp(20px,1.3vw,24px); line-height:1.75; }
.card.letter .greet { font-style:italic; color:var(--violet); font-weight:700; }
.card.letter .sign { text-align:right; font-family:var(--serif); font-style:italic; }
.card.letter .note { font-family:var(--sans); font-size:20px; color:#4A5562; }
.close { position:absolute; top:14px; right:14px; width:60px; height:60px; border-radius:50%; border:0; cursor:pointer;
  background:var(--noapte); color:var(--var); font:700 30px var(--sans); line-height:1; }
.card.letter .close { background:#1B2733; }
.card .ic + h2 { padding-right:0; }
.cardhead { display:flex; gap:22px; align-items:center; padding-right:70px; margin-bottom:18px; }
.cardhead .s { margin:0; }
footer { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:2px solid var(--ardezie);
  margin:0 clamp(16px,4vw,80px); padding:12px 0 16px; color:var(--ceata); font-size:20px; }
footer b { color:var(--ocru); font-weight:600; }
@media (max-width: 1100px), (max-height: 830px), (max-aspect-ratio: 1/1) {
  .stage { aspect-ratio:auto; width:100%; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:22px 12px; padding:20px 16px 26px; align-items:start; }
  .beam { display:none; }
  .capsule { position:relative; left:auto; bottom:auto; transform:none; grid-column:1 / -1; width:min(40%, 150px); justify-self:center; order:-2; }
  .obj { position:static; transform:none; width:auto; opacity:1; display:none; pointer-events:auto; transition:none; }
  .open .obj { display:flex; transform:none; animation:pop .55s cubic-bezier(.2,.9,.25,1) both; animation-delay:var(--d); }
  .bubble { width:clamp(84px, 9vw, 120px); }
  .lbl { font-size:19px; white-space:normal; text-align:center; }
  .sub { font-size:16px; white-space:normal; text-align:center; }
}
@media (max-height: 830px) and (min-width: 761px) {
  header { padding-top:14px; }
  h1 { font-size:36px; margin:8px 0 0; }
  .lead { font-size:19px; }
  .chip { font-size:16px; padding:6px 16px; }
}
@media (max-width: 760px) {
  .stage { grid-template-columns:repeat(2, 1fr); padding:20px 12px 26px; }
  .capsule { width:min(46%, 200px); }
  .obj-big { grid-column:1 / -1; order:-1; }
  .bubble { width:clamp(84px, 26vw, 120px); }
  .card .ic { width:76px; height:76px; }
  .cardhead { gap:14px; padding-right:58px; }
  .close { width:56px; height:56px; top:10px; right:10px; }
}
@keyframes pop { from { opacity:0; transform:translateY(24px) scale(.6); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

    setTimeout(function () { closeBtn.focus(); }, 50);
  }
  function closeCard() {
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden", "true");
    if (lastFocus) lastFocus.focus();
  }

  document.addEventListener("keydown", function (e) {
