<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terezian, Sibiu</title>
<style>
:root{
  --bg:#0F1720;--surf:#1B2733;--surf2:#223241;--line:#2E4153;
  --petrol:#0E7C86;--petrol2:#12959F;--violet:#6E56CF;--ocru:#E2A62B;--tigla:#B9583A;
  --var:#F3EFE6;--ceata:#A9B4C0;--chip:#D6409F;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:clamp(16px,4.17vw,80px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--var)}
body{font-family:var(--sans);font-size:clamp(17px,1.05vw,24px);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 var(--pad)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:clamp(14px,2vw,38px) 0 clamp(10px,1.1vw,22px)}
.brand{display:flex;align-items:center;gap:clamp(10px,1.2vw,24px);flex-wrap:wrap;min-width:0}
.chip{background:var(--chip);color:var(--bg);font-weight:700;letter-spacing:.12em;font-size:clamp(12px,.85vw,18px);padding:.5em 1.1em;border-radius:999px;white-space:nowrap}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.5vw,52px);line-height:1.1;margin:0}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{font:inherit;font-weight:700;min-height:52px;min-width:64px;padding:0 .9em;background:transparent;color:var(--ceata);border:0;cursor:pointer;letter-spacing:.06em;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ocru);color:var(--bg)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:2px solid var(--surf);padding:12px 0 clamp(12px,1.1vw,22px);color:var(--ceata);font-size:clamp(13px,1.1vw,22px)}
.foot .tag{color:var(--ocru);font-weight:600}
.btn{font:inherit;font-weight:600;min-height:56px;padding:.55em 1.2em;border-radius:14px;border:2px solid transparent;background:var(--petrol);color:var(--var);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:transform .15s,background .2s,border-color .2s,opacity .25s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.seg button:focus-visible,.dot:focus-visible{outline:3px solid var(--ocru);outline-offset:3px}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.accent{background:var(--ocru);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
@media (hover:hover){.btn:hover:not(:disabled){background:var(--petrol2)}.btn.ghost:hover:not(:disabled){background:transparent;border-color:var(--ocru)}.btn.accent:hover{background:#efb944}}

/* deck */
.deck{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y;border-radius:24px;display:flex}
.track{display:flex;width:100%;transition:transform .65s cubic-bezier(.2,.75,.2,1);will-change:transform}
.slide{flex:0 0 100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,80px);align-items:center;padding:clamp(8px,1.2vw,24px) 0;overflow:hidden}
.slide.full{grid-template-columns:1fr;align-content:center}
.slide .txt>*{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.slide.active .txt>*{opacity:1;transform:none}
.slide.active .txt>*:nth-child(2){transition-delay:.08s}.slide.active .txt>*:nth-child(3){transition-delay:.16s}.slide.active .txt>*:nth-child(4){transition-delay:.24s}.slide.active .txt>*:nth-child(5){transition-delay:.32s}.slide.active .txt>*:nth-child(6){transition-delay:.4s}
.kicker{color:var(--ocru);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.9em;margin:0 0 .6em}
.slide h2{font-family:var(--serif);font-size:clamp(28px,3.5vw,72px);line-height:1.1;margin:0 0 .45em}
.slide p{margin:0 0 .8em;max-width:32em;font-size:1.2em}
.slide p.muted{color:var(--ceata);font-size:1em}
.slide .src{color:var(--ceata);font-size:.95em;font-style:italic;margin-top:.6em}
.ill{border-radius:24px;overflow:hidden;background:#172431;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;transform:scale(.96);transition:opacity .7s ease .1s,transform .7s ease .1s}
.slide.active .ill{opacity:1;transform:none}
.ill svg{display:block;width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,22px)}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.3vw,26px)}
.tile b{display:block;font-family:var(--serif);font-size:clamp(26px,2.6vw,52px);color:var(--ocru);line-height:1.1;margin-bottom:.15em;overflow-wrap:anywhere}
.tile span{color:var(--var);font-size:1.08em}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.1vw,20px)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,1.2vw,24px);display:flex;flex-direction:column;gap:.5em}
.card svg{width:clamp(48px,4.2vw,80px);height:auto}
.card h3{font-family:var(--serif);margin:0;font-size:1.25em}
.card p{font-size:1.02em;margin:0;color:var(--var)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:clamp(8px,.9vw,16px)}
.list li{display:flex;gap:.9em;align-items:flex-start;background:var(--surf);border-radius:16px;padding:.7em 1em;border:1px solid var(--line);font-size:1.1em}
.list li .y{flex:none;font-family:var(--serif);font-weight:700;color:var(--ocru);min-width:3.2em;font-size:1.1em}
.list li .h{flex:none;color:var(--chip);font-size:1.2em;line-height:1.2}
.badge{display:inline-block;background:var(--violet);color:var(--var);font-weight:700;border-radius:99px;padding:.3em .9em;font-size:.9em}
.slide p.big{max-width:none;font-family:var(--serif);font-weight:700;font-size:clamp(54px,7vw,140px);line-height:1;color:var(--ocru);margin:0 0 .15em;letter-spacing:-.02em}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(8px,1vw,18px) 0}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dot{width:48px;height:48px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;touch-action:manipulation}
.dot i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dot[aria-current="true"] i{background:var(--ocru);transform:scale(1.35)}
.mid{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.count{color:var(--ceata);min-width:4em;text-align:center}
.hint{color:var(--ceata);font-size:.9em}

@media (max-width:1000px){
  .slide{grid-template-columns:1fr;align-content:start;overflow-y:auto;gap:16px}
  .slide .ill{max-width:520px;order:-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .top{display:grid;grid-template-columns:1fr}
  .tools .btn{padding:.4em .8em}
  .dot{width:22px;height:44px}
  .dot i{width:10px;height:10px}
  .count{display:none}
  .nav .btn{padding:.4em .8em}
  .nav .lbl{display:none}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
